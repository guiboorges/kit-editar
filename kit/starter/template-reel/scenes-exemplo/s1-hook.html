  <script>
    (function () {
      const R = document.getElementById("s1-hook-root");
      const q = (s) => R.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // ── cue grid (scene-local word starts) — every beat reads from here ──
      const CUT = 2.75;          // hard cut criador1 → the user's own character (Genjutsu)
      const NEM = 2.05;          // "nem existe" → stamp slam
      const FIVE = 3.88;         // "5" → timer must already be sharp
      const POP = 3.76;          // timer pill pop start (sharp by ~3.90)
      const EXIT = 4.42;         // blur-out 0.2s; everything ends ≤ 4.63 (< 4.67 − 1 frame)
      const XD = 0.2;            // exit duration

      const OUT = (el, t, o = {}) => tl.to(el, Object.assign({ opacity: 0, scale: o.s ?? 1.04, filter: `blur(${o.b ?? 14}px)`,
        duration: o.d ?? XD, ease: "power2.in" }, o.y !== undefined ? { y: o.y } : {}), t);

      const broll = q("#s1-hook-broll"), punch = q("#s1-hook-punch");
      const shot1 = q("#s1-hook-shot1"), shot2 = q("#s1-hook-shot2");

      // ── B-roll: punchy open (visible at frame 0, no fade) + slow drifts ──
      tl.fromTo(punch, { scale: 1.09 }, { scale: 1, duration: 0.42, ease: "expo.out" }, 0);
      tl.fromTo(shot1, { scale: 1.06 }, { scale: 1.0, duration: CUT, ease: "none" }, 0);
      tl.set(shot1, { opacity: 0 }, CUT);
      tl.fromTo(shot2, { scale: 1.0 }, { scale: 1.05, duration: 4.63 - CUT, ease: "none" }, CUT);
      // brighter car plate → extra caption scrim from the cut on
      tl.fromTo("#s1-hook-scrim2", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, CUT);
      // impact punches on the slam and on the timer (from-state = rest → seek-safe)
      tl.fromTo(punch, { scale: 1 }, { scale: 1.045, duration: 0.05, ease: "power2.out", immediateRender: false }, NEM - 0.06);
      tl.to(punch, { scale: 1, duration: 0.42, ease: "power3.out" }, NEM - 0.01);
      tl.fromTo(punch, { scale: 1 }, { scale: 1.03, duration: 0.05, ease: "power2.out", immediateRender: false }, POP + 0.02);
      tl.to(punch, { scale: 1, duration: 0.4, ease: "power3.out" }, POP + 0.07);
      // 2-frame white flash on the hard cut
      tl.fromTo("#s1-hook-flash", { opacity: 0 }, { opacity: 0.55, duration: 0.001 }, CUT);
      tl.to("#s1-hook-flash", { opacity: 0, duration: 0.12, ease: "power1.out" }, CUT + 0.001);

      // ── "100% IA" tag: spring pop (expo front, no wobble) + finite live-dot pulse ──
      tl.fromTo("#s1-hook-tag", { opacity: 0, scale: 0.55, x: 16, filter: "blur(8px)" },
        { opacity: 1, scale: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0.18);
      tl.fromTo("#s1-hook-halo", { scale: 1, opacity: 0.8 },
        { scale: 2.6, opacity: 0, duration: 0.8, ease: "power2.out", repeat: 3 }, 0.5);
      tl.to("#s1-hook-tag", { y: -6, duration: EXIT - 0.63, ease: "none" }, 0.63);

      // ── attribution chip: rise in, drift, hard swap on the cut ──
      tl.fromTo("#s1-hook-chip1", { opacity: 0, y: 30, scale: 0.96, filter: "blur(12px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0.35);
      tl.to("#s1-hook-chip1", { y: -8, duration: CUT - 0.8, ease: "none" }, 0.8);
      tl.set("#s1-hook-chip1", { opacity: 0 }, CUT);
      tl.fromTo("#s1-hook-chip2", { opacity: 0, y: 24, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.25, ease: "power3.out" }, CUT);
      tl.to("#s1-hook-chip2", { y: -6, duration: EXIT - (CUT + 0.25), ease: "none" }, CUT + 0.25);

      // ── STAMP slam on "nem existe" (kinetic-beat-slam: scale+blur hit, then settle) ──
      // expo.out never overshoots, so the blur channel can never go negative.
      tl.fromTo("#s1-hook-stamp", { opacity: 0, scale: 1.7, rotation: -4, filter: "blur(8px)" },
        { opacity: 1, scale: 1, rotation: -4, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, NEM - 0.05);
      tl.to("#s1-hook-stamp", { scale: 1.03, duration: CUT - (NEM + 0.17), ease: "none" }, NEM + 0.17);
      tl.set("#s1-hook-stamp", { opacity: 0 }, CUT);
      // impact echo: lime outline pushes out from the block as it lands
      tl.fromTo("#s1-hook-echo", { opacity: 0, scale: 1 }, { opacity: 0.95, scale: 1.0, duration: 0.001 }, NEM + 0.06);
      tl.to("#s1-hook-echo", { opacity: 0, scale: 1.32, duration: 0.42, ease: "power2.out" }, NEM + 0.061);

      // ── TIMER pill: opacity/blur on a NON-overshooting ease (blur can never go negative),
      //    scale on its own spring channel (spring-pop-entrance) ──
      tl.fromTo("#s1-hook-timer", { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, POP);
      tl.fromTo("#s1-hook-timer", { scale: 0.6 },
        { scale: 1, duration: 0.42, ease: "back.out(1.8)", immediateRender: false }, POP);
      tl.to("#s1-hook-timer", { scale: 1.03, duration: EXIT - (POP + 0.42), ease: "none" }, POP + 0.42);

      // stopwatch ring draws (svg-path-draw) and DRIVES the readout: 0:00 → 4:59, decelerating to a stop under 5:00
      const ring = q("#s1-hook-ring"), digits = q("#s1-hook-digits");
      const LEN = 2 * Math.PI * 26;
      const STOP = 299;                                    // seconds → 4:59
      ring.style.strokeDasharray = `${LEN}`;
      const clock = { p: 0 };
      let lastS = -1;
      const paint = () => {
        const p = clock.p;
        ring.style.strokeDashoffset = `${LEN * (1 - p * (STOP / 300))}`;
        const s = Math.round(p * STOP);
        if (s !== lastS) { lastS = s; digits.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
      };
      paint();
      const RUN = 0.5;
      tl.fromTo(clock, { p: 0 }, { p: 1, duration: RUN, ease: "power3.out", onUpdate: paint }, POP + 0.02);
      tl.fromTo("#s1-hook-hand", { rotation: 0, svgOrigin: "38 47" },
        { rotation: 359, svgOrigin: "38 47", duration: RUN, ease: "power3.out" }, POP + 0.02);
      // landing: lime sonar pulse off the stopwatch when the clock stops on 4:59 ("minutos")
      tl.fromTo("#s1-hook-sonar", { opacity: 0, scale: 1 }, { opacity: 0.9, scale: 1, duration: 0.001 }, POP + RUN - 0.08);
      tl.to("#s1-hook-sonar", { opacity: 0, scale: 1.75, duration: 0.4, ease: "power2.out" }, POP + RUN - 0.079);

      // ── EXIT: everything blurs out, B-roll fades so the paper shows for s2 ──
      OUT("#s1-hook-tag", EXIT);
      OUT("#s1-hook-chip2", EXIT);
      OUT("#s1-hook-timer", EXIT, { s: 1.08 });
      tl.fromTo(broll, { opacity: 1, scale: 1, filter: "blur(0px)" },
        { opacity: 0, scale: 1.03, filter: "blur(10px)", duration: XD, ease: "power2.in", immediateRender: false }, EXIT + 0.01);

      window.__timelines["s1-hook"] = tl;
    })();
  </script>
