              <div data-hf-id="hf-6772" class="tile" id="s6-teste-t2" style="left:328px"><svg data-hf-id="hf-7bj1" viewBox="0 0 48 48"><rect data-hf-id="hf-kqdq" x="6" y="9" width="36" height="30" rx="6" fill="none" stroke="#D3D3CC" stroke-width="3.5" /><circle data-hf-id="hf-fi4p" cx="17" cy="19" r="4" fill="#D3D3CC" /><path data-hf-id="hf-rh3f" d="M9 36l11-11 7 7 5-5 8 8" fill="none" stroke="#D3D3CC" stroke-width="3.5" stroke-linejoin="round" /></svg><div data-hf-id="hf-4p7n" class="sheen"></div></div>
              <div data-hf-id="hf-xoi8" class="tile" id="s6-teste-t3" style="left:628px"><svg data-hf-id="hf-8ig4" viewBox="0 0 48 48"><rect data-hf-id="hf-l4or" x="6" y="9" width="36" height="30" rx="6" fill="none" stroke="#D3D3CC" stroke-width="3.5" /><circle data-hf-id="hf-gp1s" cx="17" cy="19" r="4" fill="#D3D3CC" /><path data-hf-id="hf-r2se" d="M9 36l11-11 7 7 5-5 8 8" fill="none" stroke="#D3D3CC" stroke-width="3.5" stroke-linejoin="round" /></svg><div data-hf-id="hf-4awm" class="sheen"></div></div>
              <div data-hf-id="hf-vzwn" id="s6-teste-cmp">
                <div data-hf-id="hf-v5f8" id="s6-teste-cbody"></div>
                <div data-hf-id="hf-8wmw" id="s6-teste-ccap"></div>
                <div data-hf-id="hf-78y3" id="s6-teste-ph">Responder ao Claude…</div>
                <div data-hf-id="hf-9kfp" id="s6-teste-ptwrap"><div data-hf-id="hf-lsii" id="s6-teste-ptmove"><span data-hf-id="hf-cli9" id="s6-teste-ptext"></span><span data-hf-id="hf-tfix" id="s6-teste-caret"></span></div></div>
                <div data-hf-id="hf-kwbd" class="tools">
                  <div data-hf-id="hf-94up" class="plus">+</div>
                  <div data-hf-id="hf-tujs" class="chip"><b data-hf-id="hf-5fje" class="hlogo"></b>higgsfield<i data-hf-id="hf-0l8b"></i></div>
                  <div data-hf-id="hf-vrjt" class="sendw"><div data-hf-id="hf-z26t" id="s6-teste-burst"></div><div data-hf-id="hf-f8y7" id="s6-teste-send"><svg data-hf-id="hf-neyx" viewBox="0 0 26 26"><path data-hf-id="hf-m4ue" d="M13 21V6M6.5 12 13 5.5 19.5 12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></div></div>
                </div>

          <div data-hf-id="hf-cxpf" id="s6-teste-sticker"><i data-hf-id="hf-0zjc"></i>teste real</div>
        </div>
      </div>
    </div>

    <div data-hf-id="hf-weut" class="row" id="s6-teste-timerrow">
      <div data-hf-id="hf-ruco" id="s6-teste-timer"><svg data-hf-id="hf-054f" viewBox="0 0 34 34"><rect data-hf-id="hf-gb5x" x="13" y="1.5" width="8" height="4" rx="1.5" fill="#141A00" /><circle data-hf-id="hf-urug" cx="17" cy="19.5" r="11.5" fill="none" stroke="#141A00" stroke-width="3" /><line data-hf-id="hf-9qz1" id="s6-teste-hand" x1="17" y1="19.5" x2="17" y2="12" stroke="#141A00" stroke-width="3" stroke-linecap="round" /></svg><span data-hf-id="hf-samt" id="s6-teste-tval">00:00</span></div>
    </div>

    <div data-hf-id="hf-ovzj" id="s6-teste-card"><img data-hf-id="hf-jwgi" id="s6-teste-cimg" src="assets/img/personagem-sheet.jpg" alt=""><div data-hf-id="hf-4ss9" id="s6-teste-flash"></div></div>
    <div data-hf-id="hf-znft" id="s6-teste-pronto"><svg data-hf-id="hf-pr3x" viewBox="0 0 26 26"><path data-hf-id="hf-n9k3" d="M5 13.5l5.2 5.2L21 7.8" fill="none" stroke="#141A00" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" /></svg>pronto</div>

    <!-- sparkles (boxes positioned by center; travel outward as they fade) -->
    <div data-hf-id="hf-1t87" class="spk" id="s6-teste-sp1" style="left:935px;top:1067px;width:46px;height:46px"><svg data-hf-id="hf-ulu9" viewBox="0 0 24 24"><path data-hf-id="hf-02k8" d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="#D4FF3A" stroke="#6E8F00" stroke-width="0.9" /></svg></div>
    <div data-hf-id="hf-oe5e" class="spk" id="s6-teste-sp2" style="left:867px;top:1045px;width:34px;height:34px"><svg data-hf-id="hf-1tol" viewBox="0 0 24 24"><path data-hf-id="hf-83bk" d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="#D4FF3A" stroke="#6E8F00" stroke-width="0.9" /></svg></div>
    <div data-hf-id="hf-g6ds" class="spk" id="s6-teste-sp3" style="left:955px;top:1130px;width:38px;height:38px"><svg data-hf-id="hf-30lo" viewBox="0 0 24 24"><path data-hf-id="hf-6weh" d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="#D4FF3A" stroke="#6E8F00" stroke-width="0.9" /></svg></div>
    <div data-hf-id="hf-i3k0" class="spk" id="s6-teste-sp4" style="left:252px;top:1050px;width:42px;height:42px"><svg data-hf-id="hf-2man" viewBox="0 0 24 24"><path data-hf-id="hf-7api" d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="#D4FF3A" stroke="#6E8F00" stroke-width="0.9" /></svg></div>
    <div data-hf-id="hf-qfnm" class="spk" id="s6-teste-sp5" style="left:91px;top:1027px;width:34px;height:34px"><svg data-hf-id="hf-3t7q" viewBox="0 0 24 24"><path data-hf-id="hf-63sf" d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="#D4FF3A" stroke="#6E8F00" stroke-width="0.9" /></svg></div>
  </div>
  <script>
    (function () {
      const R = document.getElementById("s6-teste-root");
      const q = (s) => R.querySelector(s), qa = (s) => Array.from(R.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const IN = (el, t, o = {}) => tl.fromTo(el,
        { opacity: 0, y: o.y ?? 70, x: o.x ?? 0, scale: o.s ?? 0.94, filter: `blur(${o.b ?? 16}px)` },
        { opacity: 1, y: 0, x: 0, scale: 1, filter: "blur(0px)", duration: o.d ?? 0.5, ease: o.e ?? "power3.out" }, t);
      const OUT = (el, t, o = {}) => tl.to(el,
        { opacity: 0, scale: o.s ?? 1.04, y: o.y ?? 0, filter: `blur(${o.b ?? 14}px)`, duration: o.d ?? 0.26, ease: "power2.in" }, t);
      const POP = (el, t, o = {}) => tl.fromTo(el, { opacity: 0, scale: o.from ?? 0.6, rotation: o.r0 ?? 0 },
        { opacity: 1, scale: 1, rotation: o.r1 ?? 0, duration: o.d ?? 0.4, ease: o.e ?? "back.out(2)", immediateRender: false }, t);
      const two = (n) => (n < 10 ? "0" : "") + n;

      // ================= window enters at once (settled by "então" 0.31) · state A (conectores) =================
      IN("#s6-teste-winbox", 0.04, { y: 120, d: 0.5 });
      IN("#s6-teste-lbl", 0.22, { y: 16, s: 1, b: 6, d: 0.4 });
      IN("#s6-teste-r1", 0.26, { y: 26, s: 0.98, b: 8, d: 0.45 });
      IN("#s6-teste-r2", 0.34, { y: 26, s: 0.98, b: 8, d: 0.45 });
      IN("#s6-teste-r3", 0.42, { y: 26, s: 0.98, b: 8, d: 0.45 });
      IN("#s6-teste-add", 0.5, { y: 26, s: 0.98, b: 8, d: 0.45 });

      // ---- drift (alive while holding) ----
      // y: slow sink; at 7.56 the timer pill lands above and nudges the window down (y = 28 exactly at 8.62)
      tl.fromTo("#s6-teste-drift", { y: 0 }, { y: 6, duration: 6.75, ease: "none" }, 0.75);
      tl.fromTo("#s6-teste-drift", { y: 6 }, { y: 24, duration: 0.42, ease: "power3.out", immediateRender: false }, 7.56);
      tl.fromTo("#s6-teste-drift", { y: 24 }, { y: 28, duration: 0.64, ease: "none", immediateRender: false }, 7.98);
      // scale: connectors hold breathes in 3.5%; resets under the A->B blur crossfade (so the typing
      // push-in starts from 1.0); after the send, a slow 1.2% drift to the hand-off (1.012 at 8.62)
      tl.fromTo("#s6-teste-drift", { scale: 1 }, { scale: 1.035, duration: 3.95, ease: "sine.inOut", immediateRender: false }, 0.75);
      tl.fromTo("#s6-teste-drift", { scale: 1.035 }, { scale: 1, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 4.7);
      tl.fromTo("#s6-teste-drift", { scale: 1 }, { scale: 1.012, duration: 1.0, ease: "none", immediateRender: false }, 7.62);

      // 1.37 "testar" — sticker
      POP("#s6-teste-sticker", 1.3, { from: 0.4, r0: -10, r1: 4, d: 0.45 });

      // 2.41 "MCP" — header pill punches in LIME, overshoots to 1.18, springs back, then cools to grey
      tl.fromTo("#s6-teste-mcp", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out", immediateRender: false }, 2.3);
      tl.fromTo("#s6-teste-mcp", { scale: 0.5 }, { scale: 1.18, duration: 0.16, ease: "power2.out", immediateRender: false }, 2.3);
      tl.to("#s6-teste-mcp", { scale: 1, duration: 0.32, ease: "back.out(2.2)" }, 2.46);
      tl.fromTo("#s6-teste-mcp", { backgroundColor: "#D4FF3A" }, { backgroundColor: "#EFEFEA", duration: 0.3, ease: "power1.inOut" }, 2.62);

      // 3.38 "claude" — the spark turns, and a soft lime pre-glow leads the eye to the Higgsfield row
      tl.fromTo("#s6-teste-clogo", { rotation: 0 }, { rotation: 120, duration: 0.7, ease: "power2.inOut" }, 3.26);
      tl.fromTo("#s6-teste-clogo", { scale: 1 }, { scale: 1.18, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 3.28);
      tl.fromTo("#s6-teste-hglow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 3.3);

      // 3.97 "higgsfield" — control-target-sync: ring + knob + track + status on ONE beat
      tl.addLabel("hf", 3.86);
      tl.fromTo("#s6-teste-knob", { x: 0 }, { x: 38, duration: 0.28, ease: "power2.inOut" }, "hf");
      tl.fromTo("#s6-teste-tg", { backgroundColor: "#E2E2DC" }, { backgroundColor: "#D4FF3A", duration: 0.28, ease: "power2.inOut" }, "hf");
      tl.fromTo("#s6-teste-ring", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1.02, duration: 0.36, ease: "back.out(2)" }, "hf");
      // status swap with no overlap: old label gone by hf+0.12, new one starts at hf+0.14
      tl.to("#s6-teste-hoff", { opacity: 0, y: -10, duration: 0.12, ease: "power2.in" }, "hf");
      tl.fromTo("#s6-teste-hon", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, "hf+=0.14");
      tl.fromTo("#s6-teste-r2", { scale: 1 }, { scale: 1.02, duration: 0.36, ease: "back.out(2)", immediateRender: false }, "hf");
      tl.to("#s6-teste-hglow", { opacity: 0.55, duration: 0.5, ease: "power2.inOut" }, "hf+=0.3");
      tl.to(["#s6-teste-r1", "#s6-teste-r3", "#s6-teste-add"], { opacity: 0.42, filter: "blur(1.5px)", duration: 0.4, ease: "power2.out" }, "hf");

      // ================= 4.80 "e detalhei" — state B (chat) =================
      tl.to("#s6-teste-stA", { opacity: 0, y: -24, filter: "blur(10px)", duration: 0.26, ease: "power2.in" }, 4.7);
      tl.fromTo("#s6-teste-stB", { opacity: 0, y: 30, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out", immediateRender: false }, 4.88);
      tl.fromTo("#s6-teste-caret", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, 4.88);
      tl.fromTo("#s6-teste-send", { opacity: 0.3 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, 4.96);
      // depth of field: the greeting steps back so the composer is the focus
      tl.fromTo("#s6-teste-greet", { opacity: 1, filter: "blur(0px)" }, { opacity: 0.5, filter: "blur(2px)", duration: 0.6, ease: "sine.inOut", immediateRender: false }, 5.0);
      // camera push-in on the composer for the whole typing beat (composer stays inside x 70–1010)
      tl.fromTo("#s6-teste-push", { scale: 1, y: 0 }, { scale: 1.065, y: -16, duration: 2.2, ease: "sine.inOut" }, 5.0);
      // composer sits under the greeting while typing (docks to the bottom on send, below)
      tl.fromTo("#s6-teste-cmp", { y: -72 }, { y: 0, duration: 0.3, ease: "power3.inOut" }, 7.42);

      // typing 4.92 -> 7.30 with authored line breaks (wrap TIME and wrap POSITION share one fact)
      const LINES = ["cria meu personagem: cabelo lilás na altura", "do ombro, bigode preto grosso, óculos redondos", "de metal, polo de tricô vinho e calça listrada"];
      const FULL = LINES.join("\n");
      const T0 = 4.92, TD = 2.38;
      const ptext = q("#s6-teste-ptext");
      const ty = { n: 0 };
      let lastK = -1;
      tl.fromTo(ty, { n: 0 }, { n: FULL.length, duration: TD, ease: "none", immediateRender: false,
        onUpdate: () => { const k = Math.round(ty.n); if (k !== lastK) { lastK = k; ptext.textContent = FULL.slice(0, k); } } }, T0);

      // composer grows upward one line at a time (cap + text translate, body clip — never height)
      const wrapAt = (m) => T0 + ((m - 0.5) / FULL.length) * TD;
      const G1 = wrapAt(LINES[0].length + 1), G2 = wrapAt(LINES[0].length + LINES[1].length + 2);
      const step = (t, h0, h1) => {
        tl.fromTo(["#s6-teste-ccap", "#s6-teste-ptwrap"], { y: h0 }, { y: h1, duration: 0.18, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo("#s6-teste-cbody", { clipPath: `inset(${h0 + 26}px 0px 0px 0px)` },
          { clipPath: `inset(${h1 + 26}px 0px 0px 0px)`, duration: 0.18, ease: "power3.out", immediateRender: false }, t);
      };
      step(G1, 80, 40);
      step(G2, 40, 0);

      // ================= 7.36 send (press-release-spring) =================
      tl.to("#s6-teste-caret", { opacity: 0, duration: 0.01, ease: "none" }, 7.34);
      tl.to("#s6-teste-send", { scale: 0.86, duration: 0.08, ease: "power1.in" }, 7.3);
      tl.to("#s6-teste-send", { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 7.38);
      tl.fromTo("#s6-teste-burst", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.4, duration: 0.5, ease: "power2.out", immediateRender: false }, 7.38);
      tl.to("#s6-teste-send", { opacity: 0.3, duration: 0.25, ease: "power1.out" }, 7.62);
      // camera eases back out as the text flies into the bubble
      tl.to("#s6-teste-push", { scale: 1, y: 0, duration: 0.3, ease: "power3.inOut" }, 7.32);

      // prompt flies up into the user bubble (same width + same breaks = same wrapping)
      tl.to("#s6-teste-greet", { opacity: 0, y: -30, filter: "blur(10px)", duration: 0.24, ease: "power2.in" }, 7.32);
      tl.to("#s6-teste-ptmove", { x: 92, y: -336, duration: 0.32, ease: "power3.inOut" }, 7.38);
      tl.fromTo("#s6-teste-bub", { opacity: 0, scale: 0.94, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.26, ease: "power3.out", immediateRender: false }, 7.52);
      // composer collapses back to one empty line (and docks, above)
      tl.fromTo("#s6-teste-ccap", { y: 0 }, { y: 80, duration: 0.3, ease: "power3.inOut", immediateRender: false }, 7.42);
      tl.fromTo("#s6-teste-cbody", { clipPath: "inset(26px 0px 0px 0px)" }, { clipPath: "inset(106px 0px 0px 0px)", duration: 0.3, ease: "power3.inOut", immediateRender: false }, 7.42);
      tl.fromTo("#s6-teste-ph", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out", immediateRender: false }, 7.7);

      // ================= 7.63 "em menos de 5 minutos" — agent theater + timer =================
      IN("#s6-teste-resp", 7.58, { y: 14, s: 1, b: 8, d: 0.35 });
      ["#s6-teste-t1", "#s6-teste-t2", "#s6-teste-t3"].forEach((id, i) => IN(id, 7.64 + i * 0.06, { y: 22, s: 0.92, b: 8, d: 0.4 }));
      tl.fromTo("#s6-teste-gen", { backgroundPosition: "100% 50%" }, { backgroundPosition: "0% 50%", duration: 0.5, ease: "none", repeat: 1, immediateRender: false }, 7.66);
      qa(".sheen").forEach((el, i) => {
        tl.fromTo(el, { x: -180 }, { x: 300, duration: 0.42, ease: "none", repeat: 1, immediateRender: false }, 7.76 + i * 0.07);
      });

      POP("#s6-teste-timer", 7.58, { from: 0.55, d: 0.42, e: "back.out(1.8)" });
      const tv = q("#s6-teste-tval");
      const clk = { s: 0 };
      let lastS = -1;
      tl.fromTo(clk, { s: 0 }, { s: 287, duration: 0.9, ease: "power2.out", immediateRender: false,
        onUpdate: () => { const s = Math.round(clk.s); if (s !== lastS) { lastS = s; tv.textContent = two(Math.floor(s / 60)) + ":" + two(s % 60); } } }, 7.65);
      tl.fromTo("#s6-teste-hand", { rotation: 0 }, { rotation: 1800, svgOrigin: "17 19.5", duration: 0.9, ease: "power2.out", immediateRender: false }, 7.65);
      tl.fromTo("#s6-teste-timer", { scale: 1 }, { scale: 1.07, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 8.53);

      // ================= 8.65 "eu tinha ele pronto" — sheet card grows out of the middle tile =================
      // window starts blurring away first, so the card never prints over sharp chat UI
      OUT("#s6-teste-winbox", 8.56, { d: 0.25, s: 1.03 });
      // middle tile center at hand-off (8.62): drift center 1360 + drift y 28 + 77 * drift scale 1.012
      // = 1465.9 -> start y +75.9 vs the final card center 1390; start scale = tile width 284 * 1.012 / 900
      const C0 = 8.62, CD = 0.48, DS = 1.012, CS = (284 * DS) / 900, CY = 1360 + 28 + 77 * DS - 1390;
      tl.fromTo("#s6-teste-card", { scale: CS, y: CY, borderRadius: 20 / CS }, { scale: 1, y: 0, borderRadius: 34, duration: CD, ease: "power3.out" }, C0);
      tl.fromTo("#s6-teste-card", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, C0);
      tl.fromTo("#s6-teste-cimg", { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, C0);
      tl.fromTo("#s6-teste-flash", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out", immediateRender: false }, C0 + 0.06);
      tl.to("#s6-teste-flash", { opacity: 0, duration: 0.36, ease: "power2.inOut" }, C0 + 0.36);

      // sparkle burst: pop in, fly outward 30–60px while fading; every one is gone by 9.37 (final frame clean for s7)
      const SPK = [
        ["#s6-teste-sp1", 8.86, 30, -44],
        ["#s6-teste-sp2", 8.89, -8, -48],
        ["#s6-teste-sp3", 8.92, 14, 42],
        ["#s6-teste-sp4", 8.99, 36, -40],
        ["#s6-teste-sp5", 9.02, -18, -46],
      ];
      SPK.forEach(([id, t, dx, dy]) => {
