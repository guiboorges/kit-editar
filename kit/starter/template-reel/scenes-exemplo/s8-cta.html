  <script>
    (function () {
      const R = document.getElementById("s8-cta-root");
      const q = (s) => R.querySelector(s), qa = (s) => Array.from(R.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const IN = (el, t, o = {}) => tl.fromTo(el,
        { opacity: 0, y: o.y ?? 70, x: o.x ?? 0, scale: o.s ?? 0.94, filter: `blur(${o.b ?? 16}px)` },
        { opacity: 1, y: 0, x: 0, scale: 1, filter: "blur(0px)", duration: o.d ?? 0.5, ease: o.e ?? "power3.out" }, t);
      const POP = (el, t, o = {}) => tl.fromTo(el, { opacity: 0, scale: o.from ?? 0.6 },
        { opacity: 1, scale: 1, duration: o.d ?? 0.4, ease: o.e ?? "back.out(2)" }, t);

      const END = 4.8;
      const ROW_H = 140;

      /* ---- 0.00 sheet rises in (blur-rise) — starts on the first frame so the s7 -> s8 hand-off has no bare stage ---- */
      IN("#s8-cta-sheetE", 0.0, { y: 140, d: 0.5, b: 14 });
      // emoji row: a left-to-right wave that keeps the stage alive through "criar o seu" (0.26 -> lands by ~1.2)
      qa("#s8-cta-emos span").forEach((el, i) => POP(el, 0.26 + i * 0.08, { from: 0.4, d: 0.36, e: "back.out(1.7)" }));

      /* ---- initial collapsed list: everything below the new slot is parked one row up ---- */
      gsap.set("#s8-cta-below", { y: -ROW_H });
      gsap.set(["#s8-cta-blk", "#s8-cta-fblk"], { scaleX: 0 });

      /* ---- 1.40 "comente aqui": input focus ---- */
      tl.fromTo("#s8-cta-focus", { opacity: 0, scale: 1.015 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 1.40);
      tl.fromTo("#s8-cta-ph", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.out" }, 1.40);

      /* ---- typing CLONE (discrete states on the key-press SFX times) ---- */
      const SEQ = [
        { t: 0, text: "" }, { t: 2.02, text: "C" }, { t: 2.08, text: "CL" }, { t: 2.14, text: "CLO" },
        { t: 2.20, text: "CLON" }, { t: 2.26, text: "CLONE" }, { t: 2.50, text: "" },
      ];
      const textAt = (t) => { for (let i = SEQ.length - 1; i >= 0; i--) if (t >= SEQ[i].t) return SEQ[i].text; return ""; };
      const typedEl = q("#s8-cta-typed"), caretEl = q("#s8-cta-caret");
      const drv = { t: 0 }; let lastTxt = null, lastCar = null;
      tl.fromTo(drv, { t: 0 }, { t: END, duration: END, ease: "none", immediateRender: false, onUpdate: () => {
        const t = drv.t, txt = textAt(t);
        if (txt !== lastTxt) { lastTxt = txt; typedEl.textContent = txt; }
        // caret: visible while focused; solid while typing, blinking (0.8s square wave) otherwise
        let c = 0;
        if (t >= 1.44 && t < 2.50) c = (t >= 1.96 && t < 2.42) ? 1 : (Math.sin((t - 1.44) * Math.PI * 2 / 0.8 + Math.PI / 2) > -0.2 ? 1 : 0);
        if (c !== lastCar) { lastCar = c; caretEl.style.opacity = String(c); }
      } }, 0);

      /* ---- send: activates, then press-release spring ---- */
