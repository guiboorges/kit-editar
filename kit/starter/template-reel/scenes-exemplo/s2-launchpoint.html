    /* ── labels: Geist 600 40px ink; mono only for the "=" ── */

  <script>
    (function () {
      const R = document.getElementById("s2-launchpoint-root");
      const q = (s) => R.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // ── cue grid (scene-local word starts) ──
      const EXISTE = 0.97, LAUNCH = 2.22, PAGA = 3.03, SO = 3.99, VIDEOS = 4.96, FEITOS = 5.60, POR = 5.88, IA = 6.12;
      const SNAP = 0.83;            // rack-focus snap → sharp on "existe"
      const PULL = 2.74;            // "que paga por view" — focus pull + pills fly out
      const HERO = VIDEOS - 0.22;   // hero promotion; mid-move lands on "vídeos"
      const EXIT = 6.28;            // blur-out 0.18s; ends 6.46 (< 6.53 − 1 frame)
      const XD = 0.18;
      const DUR = 6.5;

      const OUT = (el, t, o = {}) => tl.to(el, Object.assign({ opacity: 0, scale: o.s ?? 1.04, filter: `blur(${o.b ?? 14}px)`,
        duration: o.d ?? XD, ease: "power2.in" }, o.y !== undefined ? { y: o.y } : {}), t);
      const F = (b, br = 1, sa = 1, co = 1) => `blur(${b}px) brightness(${br}) saturate(${sa}) contrast(${co})`;   // one filter grammar → clean interpolation

      // ── layout constants (pre-computed; never measured at tween time) ──
      const CARD = { x: 70, y: 1060, w: 940, h: 434, k: 0.892 };
      const CC = { x: CARD.x + CARD.w / 2, y: CARD.y + CARD.h / 2 };
      const DRIFT = 1.03;                                   // card scale at the moment of the pull
      const ROW_TOP = 1430, PILL_TOP = 35, PILL_H = 70;
      const PILLS = [                                       // [id, final left, final width, in-image box x0,x1,y0,y1]
        ["#s2-launchpoint-p1", 106.5, 276, 335, 465, 430, 463],
        ["#s2-launchpoint-p2", 402.5, 335, 473, 631, 430, 463],
        ["#s2-launchpoint-p3", 757.5, 168, 639, 718, 430, 463],
      ];
      const pullFrom = (p) => {
        const [, left, w, x0, x1, y0, y1] = p;
        const cx = CARD.x + ((x0 + x1) / 2) * CARD.k, cy = CARD.y + ((y0 + y1) / 2) * CARD.k;
        const sx = CC.x + (cx - CC.x) * DRIFT, sy = CC.y + (cy - CC.y) * DRIFT;      // in-card centre after drift
        const fx = left + w / 2, fy = ROW_TOP + PILL_TOP + PILL_H / 2;               // final centre
        return { x: sx - fx, y: sy - fy, scale: ((y1 - y0) * CARD.k * DRIFT) / PILL_H };
      };
      const P1C = 106.5 + 276 / 2, P2C = 402.5 + 335 / 2, P3C = 757.5 + 168 / 2;      // slot centres (x)

      const card = q("#s2-launchpoint-card"), lens = q("#s2-launchpoint-lens"), dof = q("#s2-launchpoint-dof");
      gsap.set(card, { transformPerspective: 1400 });

      // ── CARD: continuous rack-focus arrival from frame 0 (no plateau), snaps sharp on "existe" ──
      tl.fromTo(card, { y: 140, scale: 0.9, rotationX: 16, filter: "blur(0px)" },
        { y: 20, scale: 0.975, rotationX: 4, filter: "blur(0px)", duration: SNAP, ease: "none" }, 0);
      tl.fromTo(lens, { opacity: 0 }, { opacity: 0.85, duration: 0.3, ease: "power2.out" }, 0);
      tl.fromTo(dof, { filter: F(8) }, { filter: F(5), duration: SNAP, ease: "none" }, 0);
      tl.to(card, { y: 0, scale: 1, rotationX: 0, duration: 0.4, ease: "power3.out" }, SNAP);
      tl.to(lens, { opacity: 1, duration: 0.3, ease: "power2.out" }, SNAP);
      tl.to(dof, { filter: F(0), duration: 0.4, ease: "power3.out" }, SNAP);
      tl.to(card, { scale: DRIFT, duration: PULL - (SNAP + 0.4), ease: "none" }, SNAP + 0.4);

      // one-shot lime sheen across the card on "launchpoint" (ambient-glow-bloom, traveling sweep)
      tl.fromTo("#s2-launchpoint-sheen", { x: -330, skewX: -16 }, { x: 1060, skewX: -16, duration: 0.7, ease: "power1.inOut" }, LAUNCH - 0.14);

      // ── BRAND pill on "launchpoint": opacity/blur on a non-overshooting ease, scale/y on the spring ──
      tl.fromTo("#s2-launchpoint-brand", { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, LAUNCH - 0.12);
      tl.fromTo("#s2-launchpoint-brand", { scale: 0.5, y: 14 },
        { scale: 1, y: 0, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, LAUNCH - 0.12);
      tl.to("#s2-launchpoint-brand", { y: -8, duration: EXIT - (LAUNCH + 0.33), ease: "none" }, LAUNCH + 0.33);

      // ── FOCUS PULL (depth-of-field-blur): card recedes into a light ghost, brand pill stays sharp ──
      tl.to(card, { y: -70, scale: 0.86, duration: 0.5, ease: "power2.inOut" }, PULL);
      tl.to(lens, { opacity: 0.24, duration: 0.5, ease: "power2.inOut" }, PULL);
      tl.to(dof, { filter: F(6, 1.5, 0.5, 0.75), duration: 0.5, ease: "power2.inOut" }, PULL);
      tl.to(card, { y: -96, scale: 0.84, duration: EXIT - (PULL + 0.5), ease: "none" }, PULL + 0.5);
      // print → twin swap is instantaneous, so the printed pills and the HTML twins never show together
      tl.fromTo("#s2-launchpoint-patch", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, PULL - 0.05);

      // ── PILLS pulled out of the card: outer pills first (CPM leads — it is spoken first), centre pill last → no crossing ──
      const LIFT_AT = { 2: 0, 0: 0.04, 1: 0.10 };
      [2, 0, 1].forEach((i) => {
        const f = pullFrom(PILLS[i]);
        tl.fromTo(PILLS[i][0], { x: f.x, y: f.y, scale: f.scale, opacity: 0, filter: "blur(0px)" },
          { x: f.x, y: f.y, scale: f.scale, opacity: 1, filter: "blur(0px)", duration: 0.001, ease: "none" }, PULL - 0.05);
        tl.to(PILLS[i][0], { x: 0, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, PULL + LIFT_AT[i]);
      });
      tl.to("#s2-launchpoint-row", { y: -8, duration: EXIT - 3.4, ease: "none" }, 3.4);

      // ── "paga": lime ring locks on $1 CPM + label (CPM pill pushes via the keyword driver below) ──
      tl.fromTo("#s2-launchpoint-ring1", { opacity: 0, scale: 1.3 },
        { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2)" }, PAGA - 0.07);
      tl.fromTo("#s2-launchpoint-l1", { opacity: 0, y: 20, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, PAGA + 0.05);
      // the other two step aside + dim, so the pushed CPM pill (and its ring) owns the row
      // (x lives on the inner .punch wrappers so it never fights the still-running lift tweens on the pills)
      tl.to(["#s2-launchpoint-p1punch", "#s2-launchpoint-p2punch"], { x: -22, duration: 0.35, ease: "power2.out" }, PAGA - 0.08);
      tl.to(["#s2-launchpoint-p1", "#s2-launchpoint-p2"], { opacity: 0.55, duration: 0.35, ease: "power2.out" }, PAGA - 0.08);

      // ── "só aceita": ring jumps to AI Videos ONLY, label swaps, BOTH other pills step back ──
      tl.to("#s2-launchpoint-ring1", { opacity: 0, scale: 1.12, duration: 0.18, ease: "power2.in" }, SO - 0.13);
      tl.to("#s2-launchpoint-l1", { opacity: 0, y: -10, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, SO - 0.13);
      tl.fromTo("#s2-launchpoint-ring2", { opacity: 0, scale: 1.3 },
        { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2)" }, SO - 0.09);
      tl.fromTo("#s2-launchpoint-l2", { opacity: 0, y: 20, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, SO - 0.02);
      tl.to(["#s2-launchpoint-p1punch", "#s2-launchpoint-p2punch"], { x: 0, duration: 0.35, ease: "power2.out" }, SO - 0.07);
      tl.to("#s2-launchpoint-p1", { opacity: 1, duration: 0.35, ease: "power2.out" }, SO - 0.07);
      tl.to("#s2-launchpoint-p2", { x: 22, opacity: 0.35, duration: 0.35, ease: "power2.out" }, SO - 0.07);
      tl.to("#s2-launchpoint-p3", { x: 22, opacity: 0.35, duration: 0.35, ease: "power2.out" }, SO - 0.07);
      // ring breathes while it holds (finite)
      tl.fromTo("#s2-launchpoint-ring2", { scale: 1 }, { scale: 1.025, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1,
        immediateRender: false }, SO + 0.3);

      // ── "vídeos": AI Videos ONLY is promoted to HERO at centre; the other two recede to the flanks (rack focus) ──
      const BOOST = 0.16, LIFT = 8, HERO_TOTAL = 1.5;
      tl.to("#s2-launchpoint-p1", { x: 540 - P1C, y: -4, scale: HERO_TOTAL / (1 + BOOST), duration: 0.45, ease: "power3.inOut" }, HERO);
      tl.to("#s2-launchpoint-p2", { x: 150 - P2C, y: 8, scale: 0.72, opacity: 0.25, filter: "blur(4px)", duration: 0.45, ease: "power3.inOut" }, HERO);
      tl.to("#s2-launchpoint-p3", { x: 900 - P3C, y: 8, scale: 0.72, opacity: 0.25, filter: "blur(4px)", duration: 0.45, ease: "power3.inOut" }, HERO);

      // ── "feitos": "100% IA" in the label gets the lime block ──
      tl.fromTo("#s2-launchpoint-hl", { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "expo.out" }, FEITOS - 0.1);

      // ── "por" → "IA": the hero turns lime, peaking ON "IA"; ring dissolves, bloom carries the beat ──
      const LIME_AT = POR - 0.04;
      tl.fromTo("#s2-launchpoint-p1lime", { clipPath: "inset(0% 100% 0% 0% round 999px)" },
        { clipPath: "inset(0% 0% 0% 0% round 999px)", duration: 0.22, ease: "power3.inOut" }, LIME_AT);
      tl.fromTo("#s2-launchpoint-p1face", { boxShadow: "0px 16px 34px rgba(36,48,190,0.30), 0px 3px 8px rgba(20,20,60,0.16)" },
        { boxShadow: "0px 16px 34px rgba(110,150,0,0.32), 0px 3px 8px rgba(20,30,0,0.16)", duration: 0.22, ease: "power2.out",
          immediateRender: false }, LIME_AT);
      tl.to("#s2-launchpoint-ring2", { opacity: 0, scale: 1.12, duration: 0.18, ease: "power2.in" }, LIME_AT);
      tl.fromTo("#s2-launchpoint-p1punch", { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out", immediateRender: false }, IA - 0.14);
      tl.to("#s2-launchpoint-p1punch", { scale: 1, duration: 0.26, ease: "power3.out" }, IA - 0.02);
      tl.fromTo("#s2-launchpoint-bloom", { opacity: 0, scale: 0.8 }, { opacity: 0.5, scale: 1, duration: 0.3, ease: "power2.out" }, LIME_AT + 0.02);

      // ── asr-keyword-glow: one linear driver; envelope → push (scale + lift) + glyph glow on the spoken pill ──
      const TIMINGS = [
        { boost: q("#s2-launchpoint-p3boost"), face: q("#s2-launchpoint-p3face"), start: PAGA - 0.08, end: SO - 0.15 },
        { boost: q("#s2-launchpoint-p1boost"), face: q("#s2-launchpoint-p1face"), start: SO - 0.08, end: 6.45 },
      ];
      const ATTACK = 0.2, RELEASE = 0.35, REST = 0.2, BLUR = 18;
      const env = (t, s, e) => {
        if (t < s) return 0;
        if (t < e) { const a = Math.min((t - s) / ATTACK, 1); return 1 - Math.pow(1 - a, 3); }
        if (t < e + RELEASE) return 1 - ((t - e) / RELEASE) * (1 - REST);
        return REST;
      };
      const drv = { t: 0 };
      const paint = () => {
        const flash = Math.min(Math.max((drv.t - LIME_AT) / 0.22, 0), 1);
        TIMINGS.forEach((w) => {
          const e = env(drv.t, w.start, w.end);
          w.boost.style.transform = `translateY(${(-LIFT * e).toFixed(2)}px) scale(${(1 + BOOST * e).toFixed(4)})`;
          w.face.style.textShadow = `0 0 ${(BLUR * e).toFixed(2)}px rgba(255,255,255,${(0.6 * e * (1 - flash)).toFixed(3)})`;
        });
      };
      paint();
      tl.fromTo(drv, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: paint }, 0);

      // ── EXIT ──
      OUT(card, EXIT - 0.02, { s: 0.95 });
      OUT("#s2-launchpoint-brand", EXIT);
      tl.fromTo("#s2-launchpoint-row", { opacity: 1, scale: 1, filter: "blur(0px)" },
        { opacity: 0, scale: 1.04, filter: "blur(14px)", duration: XD, ease: "power2.in", immediateRender: false }, EXIT);

      window.__timelines["s2-launchpoint"] = tl;
    })();
  </script>
</template>
