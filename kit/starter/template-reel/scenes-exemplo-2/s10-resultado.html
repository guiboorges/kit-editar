  <div data-hf-id="hf-2o60" id="s10-resultado-root" data-composition-id="s10-resultado" data-width="1080" data-height="1920">

  <script>
    (function () {
      /* s10-resultado — global 54.600 → 58.533 (3.933s). Cues are scene-local word starts.
         Cards 400x640 at LEFT 110..510 / RIGHT 570..970, y 1030..1670. Both videos share one mapping:
         media = local − 0.10 + 0.40 (original-2883 ≡ genjutsu frame for frame). HOLD — NO EXIT: the camera
         expands over the stage from 3.567 (covers it by 3.927). */
      const R = document.getElementById("s10-resultado-root");
      const q = (s) => R.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const NIR = { immediateRender: false };
      const ft = (el, from, to, t) => tl.fromTo(el, from, Object.assign({}, to, NIR), t);
      // two-channel pop: opacity on power2.out (child), scale on back.out (wrapper) — no blur on the overshoot channel
      const POP2 = (sc, fade, t, o = {}) => {
        ft(fade, { opacity: 0 }, { opacity: 1, duration: o.fd ?? 0.2, ease: "power2.out" }, t);
        ft(sc, { scale: o.from ?? 0.6, y: o.y ?? 10 }, { scale: 1, y: 0, duration: o.d ?? 0.4, ease: o.e ?? "back.out(1.8)" }, t);
      };

      /* ---------------- cue grid ---------------- */
      const RETORNOU = 1.05, VIDEO = 1.61, PERSONAGEM = 2.71, IA = 3.31, END = 3.933;

      /* ---------------- 0.05 ORIGINAL enters solo at the centre (blur-rise), still "manipulando…" ---------------- */
      tl.fromTo("#s10-resultado-Lin",
        { opacity: 0, y: 70, scale: 0.94, filter: "blur(16px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", force3D: false }, 0.05);
      // one scan pass + shimmer + spinner, then the pill fades at 0.6 (continuity with s9's processing state)
      ft("#s10-resultado-scan", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.1);
      ft("#s10-resultado-scan", { y: -70 }, { y: 640, duration: 0.5, ease: "power1.inOut" }, 0.1);
      ft("#s10-resultado-spin", { rotation: 0 }, { rotation: 540, svgOrigin: "13 13", duration: 0.8, ease: "none" }, 0.0);
      ft("#s10-resultado-proc", { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0, scale: 0.9, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, 0.6);
      ft("#s10-resultado-shim", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 0.5);

      /* ---------------- 0.95 "retornou": RESULT slides out from behind, ORIGINAL to the left slot, book-open tilt ---------------- */
      const SL = RETORNOU - 0.10, SD = 0.5;
      tl.set("#s10-resultado-Rshow", { opacity: 1 }, SL - 0.01);
      tl.fromTo("#s10-resultado-Lmove", { x: 230 }, { x: 0, duration: SD, ease: "power3.out", force3D: false }, SL);
      tl.fromTo("#s10-resultado-Rmove", { x: -230 }, { x: 0, duration: SD, ease: "power3.out", force3D: false }, SL);
      tl.fromTo("#s10-resultado-Ltilt", { rotationY: 0, transformPerspective: 1200 }, { rotationY: 8, transformPerspective: 1200, duration: SD, ease: "power3.out", force3D: false }, SL);
      tl.fromTo("#s10-resultado-Rtilt", { rotationY: 0, transformPerspective: 1200 }, { rotationY: -8, transformPerspective: 1200, duration: SD, ease: "power3.out", force3D: false }, SL);
      ft("#s10-resultado-Ltilt", { rotationY: 8 }, { rotationY: 3, duration: 0.6, ease: "sine.inOut", force3D: false }, SL + SD);
      ft("#s10-resultado-Rtilt", { rotationY: -8 }, { rotationY: -3, duration: 0.6, ease: "sine.inOut", force3D: false }, SL + SD);
      // a quick glint on the RESULT's left edge, timed to the moment that edge clears the ORIGINAL (~SL+0.25);
      // kept narrow + short so the character reads clean on "retornou" (a wide/long flash fogged the reveal)
      ft("#s10-resultado-flash", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, SL + 0.19);
      ft("#s10-resultado-flash", { opacity: 1 }, { opacity: 0, duration: 0.34, ease: "power2.out" }, SL + 0.27);

      // slow synced push on both videos (same origin + scale -> the comparison stays frame-for-frame)
      ft(["#s10-resultado-Lkb", "#s10-resultado-Rkb"], { scale: 1 }, { scale: 1.07, duration: END - 0.1, ease: "none", force3D: false }, 0.1);

      /* ---------------- 1.51 "o vídeo meu": ORIGINAL label ---------------- */
      POP2("#s10-resultado-labOsc", "#s10-resultado-labO", VIDEO - 0.12, { d: 0.38 });

      /* ---------------- 2.61 "personagem": RESULTADO label + ring hug + punch + sparkle burst ---------------- */
      POP2("#s10-resultado-labRsc", "#s10-resultado-labR", PERSONAGEM - 0.12, { d: 0.4 });
      ft("#s10-resultado-ring", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, PERSONAGEM - 0.08);
      ft("#s10-resultado-ring", { scale: 1.06 }, { scale: 1, duration: 0.36, ease: "back.out(1.8)" }, PERSONAGEM - 0.08);
      ft("#s10-resultado-Rtilt", { scale: 1 }, { scale: 1.035, duration: 0.3, ease: "power2.out", force3D: false }, PERSONAGEM - 0.08);
      ft("#s10-resultado-Rtilt", { scale: 1.035 }, { scale: 1.02, duration: 0.6, ease: "power2.inOut", force3D: false }, PERSONAGEM + 0.22);

      // deterministic sparkle burst: 8 lime 4-point stars fanned −118°..−18° from the top-right corner (pre-solved speeds keep
      // them right of x 880, above-band y ≥ 940, inside x 1056). One proxy drives all; opacity 0 at T = 0 for back-seeks.
      const prand = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      const field = q("#s10-resultado-burst");
      const P4 = "M12 .5Q13.1 10.9 23.5 12 13.1 13.1 12 23.5 10.9 13.1 .5 12 10.9 10.9 12 .5Z";
      const STAR = '<svg viewBox="0 0 24 24"><path d="' + P4 + '" fill="#D4FF3A"/><path d="' + P4 + '" fill="#FFFFFF" transform="translate(12 12) scale(.42) translate(-12 -12)"/></svg>';
      const parts = [], N = 8;
      const SPEED = [330, 280, 360, 300, 380, 300, 290, 260], SIZE = [40, 28, 46, 26, 42, 30, 34, 26];
      for (let i = 0; i < N; i++) {
        const el = document.createElement("div");
        el.className = "pt lime";
        const size = SIZE[i];
        el.style.width = size + "px"; el.style.height = size + "px";
        el.style.marginLeft = (-size / 2) + "px"; el.style.marginTop = (-size / 2) + "px";
        el.innerHTML = STAR;
        field.appendChild(el);
        const a = (-118 + (100 * i) / (N - 1) + (prand(i * 5 + 2) - 0.5) * 6) * Math.PI / 180;
        parts.push({ el, vx: Math.cos(a) * SPEED[i], vy: Math.sin(a) * SPEED[i], spin: (prand(i * 11 + 4) * 2 - 1) * 160 });
      }
      const FL = 0.6, G = 80, BURST = PERSONAGEM - 0.04;
      const drive = { T: 0 };
      tl.fromTo(drive, { T: 0 }, { T: 1, duration: FL, ease: "none", immediateRender: false, onUpdate: () => {
        const t = drive.T * FL, drag = 1 - 0.45 * drive.T;
        const fade = drive.T < 0.5 ? 1 : Math.max(0, (1 - drive.T) / 0.5);
        const sc = drive.T < 0.18 ? 0.25 + 0.75 * (drive.T / 0.18) : 1 - 0.45 * (drive.T - 0.18);
        parts.forEach((p) => {
          const x = p.vx * t * drag, y = p.vy * t * drag + 0.5 * G * t * t;
          p.el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${(p.spin * t).toFixed(1)}deg) scale(${sc.toFixed(3)})`;
          p.el.style.opacity = String(drive.T === 0 ? 0 : fade);
        });
      } }, BURST);

      /* ---------------- 3.21 "IA": glass "● 100% IA" tag inside the RESULT card ---------------- */
      POP2("#s10-resultado-tagsc", "#s10-resultado-tag", IA - 0.10, { from: 0.5, y: 0, d: 0.38, e: "back.out(2)" });

      /* ---------------- holding: phase-opposed float (±8px), amplitude eases in; labels breathe up together ---------------- */
      const Lf = q("#s10-resultado-Lfloat"), Rf = q("#s10-resultado-Rfloat");
      const F0 = SL + SD, PER = 2.4, AMP = 8;
      const ph = { p: 0 };
      tl.fromTo(ph, { p: 0 }, { p: (END - F0) / PER * Math.PI * 2, duration: END - F0, ease: "none", immediateRender: false, onUpdate: () => {
        const env = Math.min(1, ph.p / 1.2);
        const s = Math.sin(ph.p) * AMP * env;
        Rf.style.transform = `translateY(${(-s).toFixed(2)}px)`;
        Lf.style.transform = `translateY(${s.toFixed(2)}px)`;
      } }, F0);
      ft("#s10-resultado-labels", { y: 0 }, { y: -6, duration: END - 1.5, ease: "sine.inOut" }, 1.5);

      /* HOLD — NO EXIT (the camera's full-screen wipe from 3.567 is the transition) */
      window.__timelines["s10-resultado"] = tl;
    })();
  </script>
