  <script>
    (function () {
      /* =====================================================================================
         FINAL FRAME (local 6.967 — s8-avatar frame 0 replicates this exactly):
         - #drift / #winbox / #push: identity transforms -> window at global (70,1000), 940x700, r34, white, card shadow.
         - header: traffic dots; Claude spark 48px at window-local (123,24) ROTATED 180deg; "Claude" 36/600;
           "MCP" pill visible (opacity 1, scale 1, bg #EFEFEA). Hairline at y 95.
         - sticker "meu teste": window-local left 714 top -27, opacity 1, rotate(4deg) scale 1.
         - state A hidden. state B visible (opacity 1, y 0, no blur):
             greeting + composer hidden (opacity 0);
             bubble #EFEFEA r26/26/8/26 at (348,124) 564x160 (hugs the text, right-aligned);
             prompt text (3 authored lines, Geist 500 30/40, -0.01em, ink, white-space pre) top-left at window-local (374,144);
             response row at (60,368) h40: spark 34 + "gerando seu avatar…" Geist Mono 25/500 ink2;
             skeleton tile #F1F1EC r20 at (60,430) 400x190 (= global 130,1430) with a 54px image glyph centred,
             white sheen band 200px wide moving LINEARLY: x = -260 + 1200*(t - 6.84)  (=> x = -68 at s7 7.000 = s8 0.000).
         ===================================================================================== */
      const R = document.getElementById("s7-claude-root");
      const q = (s) => R.querySelector(s), qa = (s) => Array.from(R.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const IN = (el, t, o = {}) => tl.fromTo(el,
        { opacity: 0, y: o.y ?? 70, x: o.x ?? 0, scale: o.s ?? 0.94, filter: `blur(${o.b ?? 16}px)` },
        { opacity: 1, y: 0, x: 0, scale: 1, filter: "blur(0px)", duration: o.d ?? 0.5, ease: o.e ?? "power3.out" }, t);
      const OUT = (el, t, o = {}) => tl.to(el,
        { opacity: 0, scale: o.s ?? 1.04, y: o.y ?? 0, filter: `blur(${o.b ?? 14}px)`, duration: o.d ?? 0.26, ease: "power2.in" }, t);
      const POP = (el, t, o = {}) => tl.fromTo(el, { opacity: 0, scale: o.from ?? 0.6, rotation: o.r0 ?? 0 },
        { opacity: 1, scale: 1, rotation: o.r1 ?? 0, duration: o.d ?? 0.4, ease: o.e ?? "back.out(2)", immediateRender: false }, t);

      // cue grid (scene-local word starts)
      const SIMPLES = 0.31, NO = 0.87, LIGUEI = 1.49, CLAUDE = 2.18, HIGGS = 2.84, MCP = 3.76, DALI = 4.40, ESPEC = 4.90, IA = 6.80;

      // ================= window enters on "simples" =================
      IN("#s7-claude-winbox", SIMPLES - 0.21, { y: 140, d: 0.5 });
      // loading skeletons breathe once while the page "loads"
      qa(".ssheen").forEach((el, i) => {
        tl.fromTo(el, { x: -300 }, { x: 1000, duration: 0.7, ease: "none", immediateRender: false }, 0.5 + i * 0.07);
      });

      // ---- drift (alive while holding): connectors hold breathes in 3%, reset to 1 under the A->B crossfade ----
      tl.fromTo("#s7-claude-drift", { scale: 1 }, { scale: 1.03, duration: 3.7, ease: "sine.inOut", force3D: false }, 0.6);
      tl.fromTo("#s7-claude-drift", { scale: 1.03 }, { scale: 1, duration: 0.4, ease: "power2.inOut", immediateRender: false, force3D: false }, 4.3);

      // ================= "no meu caso" — corner sticker =================
      POP("#s7-claude-sticker", NO - 0.02, { from: 0.4, r0: -10, r1: 4, d: 0.45 });

      // ================= "liguei" — conectores cascade in over their skeletons =================
      IN("#s7-claude-lbl", LIGUEI - 0.15, { y: 16, s: 1, b: 6, d: 0.4 });
      [["#s7-claude-r1", "#s7-claude-k1"], ["#s7-claude-r2", "#s7-claude-k2"], ["#s7-claude-r3", "#s7-claude-k3"]].forEach(([row, sk], i) => {
        const t = LIGUEI - 0.09 + i * 0.08;
        IN(row, t, { y: 26, s: 0.98, b: 8, d: 0.45 });
        tl.to(sk, { opacity: 0, duration: 0.3, ease: "power1.out" }, t + 0.08);
      });
      IN("#s7-claude-add", LIGUEI - 0.09 + 0.24, { y: 26, s: 0.98, b: 8, d: 0.45 });

      // ================= "claude" — the spark turns once + terracotta pulse; lime pre-glow leads the eye to Higgsfield =================
      tl.fromTo("#s7-claude-clogo", { rotation: 0 }, { rotation: 180, duration: 0.5, ease: "power2.inOut" }, CLAUDE - 0.12);
      tl.fromTo("#s7-claude-clogo", { scale: 1 }, { scale: 1.18, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, CLAUDE - 0.1);
      tl.fromTo("#s7-claude-cpulse", { opacity: 0.85, scale: 0.8 }, { opacity: 0, scale: 2.3, duration: 0.55, ease: "power2.out", immediateRender: false }, CLAUDE - 0.04);
      tl.fromTo("#s7-claude-hglow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, CLAUDE + 0.04);

      // ================= "higgsfield" — control-target-sync: toggle ON + ring + status on ONE label =================
      tl.addLabel("hf", HIGGS - 0.08);
      tl.fromTo("#s7-claude-knob", { x: 0 }, { x: 36, duration: 0.28, ease: "power2.inOut" }, "hf");
      tl.fromTo("#s7-claude-tg", { backgroundColor: "#E2E2DC" }, { backgroundColor: "#D4FF3A", duration: 0.28, ease: "power2.inOut" }, "hf");
      tl.fromTo("#s7-claude-ring", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1.02, duration: 0.36, ease: "back.out(2)" }, "hf");
      tl.to("#s7-claude-hoff", { opacity: 0, y: -10, duration: 0.12, ease: "power2.in" }, "hf");
      tl.fromTo("#s7-claude-hon", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, "hf+=0.14");
      tl.fromTo("#s7-claude-r2", { scale: 1 }, { scale: 1.02, duration: 0.36, ease: "back.out(2)", immediateRender: false }, "hf");
      tl.to("#s7-claude-hglow", { opacity: 0.55, duration: 0.5, ease: "power2.inOut" }, "hf+=0.3");
      tl.to(["#s7-claude-r1", "#s7-claude-r3", "#s7-claude-add"], { opacity: 0.42, filter: "blur(1.5px)", duration: 0.4, ease: "power2.out" }, "hf");

      // ================= "MCP" — header pill punch-then-cool + the plug cable draws logo -> Higgsfield =================
      tl.fromTo("#s7-claude-mcp", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out", immediateRender: false }, MCP - 0.1);
      tl.fromTo("#s7-claude-mcp", { scale: 0.5 }, { scale: 1.18, duration: 0.16, ease: "power2.out", immediateRender: false }, MCP - 0.1);
      tl.to("#s7-claude-mcp", { scale: 1, duration: 0.32, ease: "back.out(2.2)" }, MCP + 0.06);
      tl.fromTo("#s7-claude-mcp", { backgroundColor: "#D4FF3A" }, { backgroundColor: "#EFEFEA", duration: 0.3, ease: "power1.inOut", immediateRender: false }, MCP + 0.22);
      const DOT = (el, t, d) => tl.fromTo(el, { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d, ease: "back.out(2.4)", immediateRender: false }, t);
      DOT("#s7-claude-pd0", MCP - 0.08, 0.3);
      tl.fromTo(["#s7-claude-plugU", "#s7-claude-plugL"], { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.inOut", immediateRender: false }, MCP - 0.06);
      DOT("#s7-claude-pd1", MCP + 0.26, 0.32);
      // the Higgsfield icon answers the plug (tiny punch)
      tl.fromTo("#s7-claude-r2 .ico", { scale: 1 }, { scale: 1.12, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, MCP + 0.28);

      // ================= "e dali" — state A -> state B (chat), crossfade with blur =================
      // A is gone (4.28 -> 4.50) right as B starts (4.49): no double exposure of the two states
      const XB = DALI + 0.09;
      tl.to("#s7-claude-stA", { opacity: 0, y: -24, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, DALI - 0.12);
      tl.fromTo("#s7-claude-stB", { opacity: 0, y: 30, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out", immediateRender: false }, XB);
      tl.fromTo("#s7-claude-ph", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, XB);
      tl.fromTo("#s7-claude-caret", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, XB + 0.06);
      tl.fromTo("#s7-claude-send", { opacity: 0.3 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, ESPEC + 0.06);

      // ================= "especifiquei como eu queria o meu avatar" — the prompt types =================
      const LINES = ["cria meu avatar de IA: cabelo lilás na", "altura do ombro, bigode preto, óculos", "redondos de metal e polo vinho"];
      const FULL = LINES.join("\n");
      const T0 = ESPEC - 0.04, TD = 1.56;                    // 4.86 -> 6.42
      tl.set("#s7-claude-ph", { opacity: 0 }, T0);
      const ptext = q("#s7-claude-ptext");
      const ty = { n: 0 };
      let lastK = -1;
      tl.fromTo(ty, { n: 0 }, { n: FULL.length, duration: TD, ease: "none", immediateRender: false,
        onUpdate: () => { const k = Math.round(ty.n); if (k !== lastK) { lastK = k; ptext.textContent = FULL.slice(0, k); } } }, T0);
      // composer grows upward one line at a time (cap + text translate, body clip — never height)
      const wrapAt = (m) => T0 + ((m - 0.5) / FULL.length) * TD;
      const G1 = wrapAt(LINES[0].length + 1), G2 = wrapAt(LINES[0].length + LINES[1].length + 2);
      const step = (t, h0, h1) => {
        tl.fromTo(["#s7-claude-ccap", "#s7-claude-ptwrap"], { y: h0 }, { y: h1, duration: 0.18, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo("#s7-claude-cbody", { clipPath: `inset(${h0 + 26}px 0px 0px 0px)` },
          { clipPath: `inset(${h1 + 26}px 0px 0px 0px)`, duration: 0.18, ease: "power3.out", immediateRender: false }, t);
      };
      step(G1, 80, 40);
      step(G2, 40, 0);
      // depth of field: the greeting steps back so the composer is the focus
      tl.fromTo("#s7-claude-greet", { opacity: 1, filter: "blur(0px)" }, { opacity: 0.45, filter: "blur(2px)", duration: 0.5, ease: "sine.inOut", immediateRender: false }, T0 + 0.1);
      // camera push-in on the composer for the whole typing beat (key text stays inside x 70–1010)
      tl.fromTo("#s7-claude-push", { scale: 1, y: 0 }, { scale: 1.06, y: -16, duration: 1.76, ease: "sine.inOut", force3D: false }, T0);
      // caret: one deterministic blink in the pause before the send
      tl.to("#s7-claude-caret", { opacity: 0, duration: 0.01, ease: "none" }, 6.46);
      tl.to("#s7-claude-caret", { opacity: 1, duration: 0.01, ease: "none" }, 6.52);
      tl.to("#s7-claude-caret", { opacity: 0, duration: 0.01, ease: "none" }, 6.56);

      // ================= "IA" — send (press-release spring) + text flies into the bubble =================
      tl.to("#s7-claude-send", { scale: 0.86, duration: 0.08, ease: "power1.in" }, IA - 0.26);
      tl.to("#s7-claude-send", { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, IA - 0.18);
      tl.fromTo("#s7-claude-burst", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.4, duration: 0.4, ease: "power2.out", immediateRender: false }, IA - 0.18);
      tl.to("#s7-claude-push", { scale: 1, y: 0, duration: 0.3, ease: "power3.inOut", force3D: false }, IA - 0.18);
      tl.to("#s7-claude-greet", { opacity: 0, y: -30, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, IA - 0.14);
      // composer visuals leave (the text itself flies on)
      // (starts a touch after the text lifts, so the release spring + lime burst still read)
      tl.to("#s7-claude-cvis", { opacity: 0, y: 60, filter: "blur(6px)", duration: 0.16, ease: "power2.in" }, IA - 0.08);
      // prompt text: composer (54,404) -> bubble text box (374,144)
      tl.fromTo("#s7-claude-ptmove", { x: 0, y: 0 }, { x: 320, y: -260, duration: 0.22, ease: "power3.inOut", immediateRender: false }, IA - 0.1);
      // bubble forms UNDER the landing text (never an empty grey box waiting ahead of it)
      tl.fromTo("#s7-claude-bub", { opacity: 0, scale: 0.94, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: "power3.out", immediateRender: false }, IA);
      // response + skeleton tile (hand-off anchor) — all settled by 6.96
      IN("#s7-claude-resp", IA - 0.02, { y: 14, s: 1, b: 8, d: 0.16 });
      IN("#s7-claude-tile", IA, { y: 18, s: 0.94, b: 8, d: 0.16 });
      // shimmer: one linear pass that continues across the cut (s8 picks it up at x = -68)
      tl.fromTo("#s7-claude-tsheen", { x: -260 }, { x: 460, duration: 0.6, ease: "none", immediateRender: false }, IA + 0.04);

      // NO EXIT — s8-avatar starts from an identical replica of this final frame
      window.__timelines["s7-claude"] = tl;
    })();
  </script>
