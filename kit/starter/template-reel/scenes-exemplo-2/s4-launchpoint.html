      const SCROLL = SWAP;              // 4.55-5.11 the page scrolls to the ranking
      const LIFT = MAIS - 0.10;         // 5.42: Higgsfield row lifts out

      // ── layout constants (pre-computed from the asset pixel boxes; never measured at tween time) ──
      const CARD = { x: 70, y: 1000, w: 940, h: 640 };
      const CC = { x: CARD.x + CARD.w / 2, y: CARD.y + CARD.h / 2 };   // card transform origin (540,1320)
      const K = 892 / 1054;                                            // print scale inside the strip
      const HERO = { x: 24, y: 84 }, GRID = { x: 24, y: 84 + 487 * K + 24 };   // grid top 520.15

      const DRIFT = 1.02;                                               // card hold scale reached at PULL
      const scaleAt = (t) => 1 + (DRIFT - 1) * Math.min(Math.max((t - (SNAP + 0.34)) / (PULL - (SNAP + 0.34)), 0), 1);
      const PILL_H = 64, PILL_CY = 1420;
      const PILLS = [   // [selector, final left, final width, in-image box x0, x1, y0, y1]
        ["#s4-launchpoint-p1", 119, 286, 335, 465, 430, 463],
        ["#s4-launchpoint-p2", 425, 346, 473, 631, 430, 463],
        ["#s4-launchpoint-p3", 791, 170, 639, 718, 430, 463],
      ];
      // where a pill sits in the card (print), for a card at scale s / y offset cy (about the card centre)
      const inCard = (p, s, cy) => {
        const [, left, w, x0, x1, y0, y1] = p;
        const px = CARD.x + HERO.x + ((x0 + x1) / 2) * K, py = CARD.y + HERO.y + ((y0 + y1) / 2) * K;
        const gx = CC.x + (px - CC.x) * s, gy = CC.y + (py - CC.y) * s + cy;
        return { x: gx - (left + w / 2), y: gy - PILL_CY, scaleX: ((x1 - x0) * K * s) / w, scaleY: ((y1 - y0) * K * s) / PILL_H };
      };

      const card = q("#s4-launchpoint-card"), lens = q("#s4-launchpoint-lens"), dof = q("#s4-launchpoint-dof"), strip = q("#s4-launchpoint-strip");
      const brandPos = q("#s4-launchpoint-brandpos"), brand = q("#s4-launchpoint-brand");
      const p1 = q("#s4-launchpoint-p1"), p2 = q("#s4-launchpoint-p2"), p3 = q("#s4-launchpoint-p3");
      const p1push = q("#s4-launchpoint-p1push"), p2push = q("#s4-launchpoint-p2push"), p3push = q("#s4-launchpoint-p3push");
      const p1punch = q("#s4-launchpoint-p1punch"), p1lime = q("#s4-launchpoint-p1lime"), pring = q("#s4-launchpoint-pring");
      const lab = q("#s4-launchpoint-lab"), hlbg = q("#s4-launchpoint-hlbg"), bloom = q("#s4-launchpoint-bloom");
      const row = q("#s4-launchpoint-row"), rdrift = q("#s4-launchpoint-rdrift"), rpunch = q("#s4-launchpoint-rpunch");
      const sh = q("#s4-launchpoint-sh"), rc = q("#s4-launchpoint-rc"), rring = q("#s4-launchpoint-rring"), rpulse = q("#s4-launchpoint-rpulse");
      const tag = q("#s4-launchpoint-tag"), hole = q("#s4-launchpoint-hole"), amtlime = q("#s4-launchpoint-amtlime");
      gsap.set(card, { transformPerspective: 1400 });

      /* ── 1. "aí é que tá" → "existe": the card is already there, defocused and drifting; snaps sharp on "existe" ── */
      tl.fromTo(card, { y: 40, scale: 0.96, rotationX: 10 }, { y: 28, scale: 0.966, rotationX: 7, duration: SNAP, ease: "none" }, 0);

      tl.to(card, { y: 0, scale: 1, rotationX: 0, duration: 0.34, ease: "power3.out" }, SNAP);
      tl.to(lens, { opacity: 1, duration: 0.3, ease: "power2.out" }, SNAP);
      tl.to(dof, { filter: F(0), duration: 0.34, ease: "power3.out" }, SNAP);
      tl.fromTo(card, { scale: 1 }, { scale: DRIFT, duration: PULL - (SNAP + 0.34), ease: "none", immediateRender: false }, SNAP + 0.34);

      /* ── 2. "launchpoint": brand pill two-channel pop + one-shot lime sheen across the card ── */
      tl.fromTo("#s4-launchpoint-sheen", { x: -340, skewX: -16 }, { x: 1060, skewX: -16, duration: 0.6, ease: "power1.inOut" }, LAUNCH - 0.14);
      tl.fromTo(brand, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, LAUNCH - 0.12);
      tl.fromTo(brand, { scale: 0.5, y: 14 }, { scale: 1, y: 0, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, LAUNCH - 0.12);
      tl.fromTo(brandPos, { y: 0 }, { y: -10, duration: END - (LAUNCH + 0.4), ease: "none" }, LAUNCH + 0.4);

      /* ── 3. "que só aceita": FOCUS PULL — card becomes a light ghost; the 3 printed pills are pulled out as crisp twins ── */
      tl.to(card, { y: -30, scale: 0.95, duration: 0.5, ease: "power2.inOut" }, PULL);
      tl.to(lens, { opacity: 0.32, duration: 0.5, ease: "power2.inOut" }, PULL);
      tl.to(dof, { filter: F(6, 1.3, 0.5, 0.75), duration: 0.5, ease: "power2.inOut" }, PULL);
      tl.to(card, { y: -38, scale: 0.94, duration: BACK - (PULL + 0.5), ease: "none" }, PULL + 0.5);
      // print → twin swap is instantaneous (patch + twins on the same frame): never a double image
      tl.fromTo("#s4-launchpoint-patch", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, APPEAR);
      const LIFT_AT = [0, 0.12, 0.06];   // AI Videos ONLY leads (it is the one spoken), outer CPM next, centre last → no crossing
      PILLS.forEach((p, i) => {
        const f = inCard(p, scaleAt(APPEAR), 0);
        tl.fromTo(p[0], { x: f.x, y: f.y, scaleX: f.scaleX, scaleY: f.scaleY, opacity: 0 },
          { x: f.x, y: f.y, scaleX: f.scaleX, scaleY: f.scaleY, opacity: 1, duration: 0.001, ease: "none" }, APPEAR);
        tl.to(p[0], { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.5, ease: "power3.out" }, PULL + LIFT_AT[i]);
      });

      /* ── 4. "vídeos": lime ring on AI Videos ONLY, the other two step back; label; "feitos" lime block; "IA" pill turns lime ── */
      // AI Videos ONLY pushes forward (nudged left), the other two step aside + dim, so the ring never touches them
      tl.fromTo(p1push, { scale: 1, x: 0, y: 0 }, { scale: 1.06, x: -8, y: -4, duration: 0.35, ease: "power3.out" }, RING - 0.04);
      tl.fromTo([p2push, p3push], { opacity: 1, x: 0 }, { opacity: 0.35, x: 26, duration: 0.35, ease: "power2.out" }, RING - 0.04);
      tl.fromTo(pring, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2)" }, RING);
      tl.fromTo(pring, { scale: 1 }, { scale: 1.03, duration: 0.28, ease: "sine.inOut", immediateRender: false }, RING + 0.38);
      tl.fromTo(lab, { opacity: 0, y: 16, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, RING + 0.06);
      tl.fromTo(hlbg, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, FEITOS - 0.08);
      tl.fromTo(p1lime, { clipPath: "inset(0% 100% 0% 0% round 999px)" },
        { clipPath: "inset(0% 0% 0% 0% round 999px)", duration: 0.2, ease: "power3.inOut" }, LIME_AT);
      tl.to(pring, { opacity: 0, scale: 1.12, duration: 0.18, ease: "power2.in" }, LIME_AT);
      tl.fromTo(bloom, { opacity: 0, scale: 0.8 }, { opacity: 0.5, scale: 1, duration: 0.3, ease: "power2.out" }, LIME_AT + 0.02);
      tl.fromTo(p1punch, { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out" }, IA - 0.14);
      tl.to(p1punch, { scale: 1, duration: 0.26, ease: "power3.out" }, IA - 0.02);

      /* ── 5. "e nela": pills + label fly back down into the card while it un-ghosts; then the page scrolls to the ranking ── */
      PILLS.forEach((p) => {
        const f = inCard(p, 1, 0);   // card is back at scale 1 / y 0 exactly at LAND
        tl.to(p[0], { x: f.x, y: f.y, scaleX: f.scaleX, scaleY: f.scaleY, duration: LAND - BACK, ease: "power2.in" }, BACK);
        tl.to(p[0], { opacity: 0, duration: 0.001, ease: "none" }, SWAP);
      });
      tl.to(p1push, { scale: 1, x: 0, y: 0, duration: LAND - BACK, ease: "power2.in" }, BACK);
      tl.to([p2push, p3push], { opacity: 1, x: 0, duration: LAND - BACK, ease: "power2.in" }, BACK);
      tl.fromTo(p1lime, { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power1.in", immediateRender: false }, BACK + 0.1);
      tl.to(bloom, { opacity: 0, duration: 0.2, ease: "power2.in" }, BACK);
      tl.to(lab, { opacity: 0, y: 40, scale: 0.7, filter: "blur(10px)", duration: 0.24, ease: "power2.in" }, BACK);
      tl.to(card, { y: 0, scale: 1, duration: LAND - BACK, ease: "power2.inOut" }, BACK);
      tl.to(lens, { opacity: 1, duration: 0.3, ease: "power2.out" }, BACK);
      tl.to(dof, { filter: F(0), duration: 0.3, ease: "power2.out" }, BACK);
      tl.to("#s4-launchpoint-patch", { opacity: 0, duration: 0.001, ease: "none" }, SWAP);
      tl.to(brand, { scale: 0.8, duration: 0.4, ease: "power2.inOut" }, NELA - 0.04);
      tl.fromTo(strip, { y: 0 }, { y: SCROLL_Y, duration: 0.56, ease: "power2.inOut" }, SCROLL);

      /* ── 6. "a empresa que mais paga": focus pull on the grid; the crisp Higgsfield row lifts out of its slot ── */
      // slot in the scrolled grid: img x6..516, y6..99 → window (24+6K .. 24+516K, 20+6K .. 20+99K) → global centre / width
      const RX0 = CARD.x + GRID.x + 6 * K, RX1 = CARD.x + GRID.x + 516 * K;
      const RY0 = CARD.y + 20 + 6 * K, RY1 = CARD.y + 20 + 99 * K;
      const S0 = (RX1 - RX0) / 860, ROW_S = 1.08;
      // swap one full frame BEFORE the lift (local 5.40 = global 17.30 is a frame): the twin is seen exactly on its print slot, then lifts
      tl.fromTo(row, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, LIFT - 0.03);
      tl.fromTo(hole, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, LIFT - 0.03);
      tl.fromTo(row, { x: (RX0 + RX1) / 2 - 540, y: (RY0 + RY1) / 2 - 1330, scale: S0 },
        { x: 0, y: 0, scale: ROW_S, duration: 0.45, ease: "power3.out" }, LIFT);
      // at S0 the type matches the print's proportions, then grows to its legible size during the lift
      tl.fromTo("#s4-launchpoint-name", { x: 2.6, y: -4.4, scale: 0.653 }, { x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, LIFT);
      tl.fromTo("#s4-launchpoint-sub", { x: 3.0, y: -10.6, scale: 0.823 }, { x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, LIFT);
      tl.fromTo("#s4-launchpoint-amtw", { x: -0.7, y: 0.3, scale: 0.85 }, { x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, LIFT);
      tl.fromTo("#s4-launchpoint-per", { x: 0.3, y: -5.6, scale: 0.89 }, { x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, LIFT);
      tl.fromTo(rc, { backgroundColor: "rgb(20,20,23)" }, { backgroundColor: "rgb(30,30,34)", duration: 0.45, ease: "power2.out" }, LIFT);
      tl.fromTo(sh, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, LIFT + 0.03);
      tl.to(card, { scale: 0.97, duration: 0.5, ease: "power2.inOut" }, LIFT);
      tl.to(lens, { opacity: 0.38, duration: 0.5, ease: "power2.inOut" }, LIFT);
      tl.to(dof, { filter: F(5, 1.3, 0.5, 0.75), duration: 0.5, ease: "power2.inOut" }, LIFT);
      tl.to(card, { y: -8, scale: 0.955, duration: END - (LIFT + 0.5), ease: "none" }, LIFT + 0.5);
      // "paga": the price lights up lime (clipped duplicate wipe)
      tl.fromTo(amtlime, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.24, ease: "power3.inOut" }, PAGA - 0.08);

      /* ── 7. "higgsfield": lime ring hugs the row + "#1" tag + punch + one echo pulse ── */
      tl.fromTo(rring, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2)" }, HIGGS - 0.12);
      tl.fromTo(tag, { opacity: 0, scale: 0.5, rotation: -8 }, { opacity: 1, scale: 1, rotation: 3, duration: 0.38, ease: "back.out(2)" }, HIGGS - 0.10);
      tl.fromTo(rpunch, { scale: 1 }, { scale: 1.035, duration: 0.12, ease: "power2.out" }, HIGGS - 0.10);
      tl.to(rpunch, { scale: 1, duration: 0.26, ease: "power2.inOut" }, HIGGS + 0.02);
      // pulse = instant set + expansion (invisible before its beat under any seek order)
      tl.fromTo(rpulse, { opacity: 0, scale: 1 }, { opacity: 0.9, scale: 1, duration: 0.01, ease: "none" }, HIGGS - 0.02);
      tl.to(rpulse, { opacity: 0, scale: 1.1, duration: 0.6, ease: "power2.out" }, HIGGS - 0.01);

      /* ── 8. HOLD — NO EXIT: everything keeps drifting to the last frame (camera wipes over from 7.333) ── */
      tl.fromTo(rdrift, { y: 0, scale: 1 }, { y: -8, scale: 1.015, duration: END - (LIFT + 0.45), ease: "none" }, LIFT + 0.45);
      tl.fromTo(rring, { scale: 1 }, { scale: 1.015, duration: END - (HIGGS + 0.3), ease: "none", immediateRender: false }, HIGGS + 0.3);

      window.__timelines["s4-launchpoint"] = tl;
    })();
  </script>
