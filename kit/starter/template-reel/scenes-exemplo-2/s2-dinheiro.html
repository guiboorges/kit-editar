    #s2-dinheiro-root .glow { position: absolute; border-radius: 50%; opacity: 0; will-change: transform, opacity; }

      letter-spacing: -0.01em; line-height: 1; white-space: nowrap; transform-origin: 30% 80%; opacity: 0;
      box-shadow: 0 10px 22px rgba(80,110,0,.30), 0 0 0 2.5px rgba(20,26,0,.92); }

    /* ---------- beat 3: "até US$ 2.000 /vídeo" (row top 1376, hero digits 150px) ---------- */
    #s2-dinheiro-root #s2-dinheiro-mglow { left: 40px; top: 1190px; width: 1000px; height: 520px;
      background: radial-gradient(closest-side, rgba(196,246,20,.58), rgba(212,255,58,.26) 48%, rgba(212,255,58,0) 100%); }
    #s2-dinheiro-root .mrow { position: absolute; left: 0; top: 1376px; width: 1080px; height: 150px; display: flex; justify-content: center;
      align-items: baseline; white-space: nowrap; opacity: 0; transform-origin: 540px 75px; will-change: transform, opacity, filter; }
    #s2-dinheiro-root .side { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; color: var(--ink2); }
    #s2-dinheiro-root .ate { margin-right: 44px; }
    #s2-dinheiro-root .per { margin-left: 44px; }
    #s2-dinheiro-root .slam { position: relative; display: inline-flex; align-items: baseline; transform-origin: 50% 60%; will-change: transform; }
    #s2-dinheiro-root .blk { position: absolute; left: -26px; right: -26px; top: -4px; bottom: -4px; border-radius: 28px; background: var(--lime);
      transform-origin: 0 50%; transform: scaleX(0);
      box-shadow: 0 30px 70px rgba(110,150,0,.26), 0 6px 16px rgba(60,80,0,.14), inset 0 -4px 0 rgba(20,26,0,.06); }
    #s2-dinheiro-root .dyn { position: relative; display: inline-flex; align-items: baseline; gap: 12px; color: var(--ink);
      transform-origin: 50% 80%; will-change: transform; }
    #s2-dinheiro-root .cur { font-size: 72px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
    #s2-dinheiro-root .num { position: relative; display: inline-block; font-size: 150px; font-weight: 800; letter-spacing: -0.03em; line-height: 1;
      font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; white-space: nowrap; }
    /* fixed-width counter: an invisible "2.000" sizes the box (and the baseline); the live value is left-anchored on top,
       so "até" / "US$" / "/vídeo" never move while the digit count grows and the final value is exactly centred */
    #s2-dinheiro-root .num-ghost { visibility: hidden; }
    #s2-dinheiro-root .num-live { position: absolute; left: 0; top: 0; white-space: nowrap; }

    /* ---------- disclaimer (y≈1610) ---------- */
    #s2-dinheiro-root .drow { position: absolute; left: 0; top: 1588px; width: 1080px; height: 46px; display: flex; justify-content: center;
      align-items: center; }
    #s2-dinheiro-root .disc { font-family: "Geist Mono", monospace; font-size: 24px; font-weight: 500; letter-spacing: 0.01em; line-height: 1;
      color: var(--ink2); padding: 11px 22px; border-radius: 999px; background: rgba(255,255,255,.72); box-shadow: 0 0 0 1.5px var(--line);
      white-space: nowrap; opacity: 0; will-change: transform, opacity, filter; }
  </style>

  <div data-hf-id="hf-mj50" id="s2-dinheiro-root" data-composition-id="s2-dinheiro" data-width="1080" data-height="1920">

      <!-- tile -->

        <div data-hf-id="hf-a4kf" class="glow" id="s2-dinheiro-tglow"></div>
        <div data-hf-id="hf-uha4" class="tile-x" id="s2-dinheiro-tx">
          <div data-hf-id="hf-zmi0" class="tile-pop" id="s2-dinheiro-tpop">

          <div data-hf-id="hf-xhzk" class="who"><div data-hf-id="hf-vhp9" class="hd">@criador_1</div><div data-hf-id="hf-92d3" class="fl">120 mil seguidores</div></div>
        </div>
        <div data-hf-id="hf-rd3r" class="plus" id="s2-dinheiro-plus1">+$</div>

          <div data-hf-id="hf-e2p4" class="who"><div data-hf-id="hf-oai1" class="hd">@criador_2</div><div data-hf-id="hf-0079" class="fl">95 mil seguidores</div></div>

  <script>
    (function () {
      const R = document.getElementById("s2-dinheiro-root");
      const q = (s) => R.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const IN = (el, t, o = {}) => tl.fromTo(el,
        { opacity: 0, y: o.y ?? 70, x: o.x ?? 0, scale: o.s ?? 0.94, filter: `blur(${o.b ?? 16}px)` },
        { opacity: 1, y: 0, x: 0, scale: 1, filter: "blur(0px)", duration: o.d ?? 0.5, ease: o.e ?? "power3.out" }, t);
      const OUT = (el, t, o = {}) => tl.to(el,
        { opacity: 0, scale: o.s ?? 1.04, y: o.y ?? 0, filter: `blur(${o.b ?? 14}px)`, duration: o.d ?? 0.26, ease: "power2.in" }, t);
      const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");   // 2000 -> 2.000

      // ── cue grid (scene-local word starts): resposta 0.21 · simples 0.75 · elas 1.27 · ganhando 1.67 · dinheiro 2.52 ──
      const TILE = 0.10;    // "resposta" → "$" answer tile pops
      const FLIP = 0.70;    // "simples" → one coin flip
      const CARDS = 1.12;   // "elas" (1.27) → the two creators slide in (sharp by ~1.30)
      const MONEY = 1.57;   // "ganhando" → money line rises
      const CNT = 1.62, CNT_D = 0.78;   // count 0 → 2.000, lands 2.40
      const SLAM = 2.42;    // "dinheiro" → lime block slam
      const DISC = 2.50;    // disclaimer (lands with the slam so it reads before the exit)
      const EXIT = 2.88;    // staggered blur-out, money line last; ends 3.12 (< 3.166 − 1 frame)

      // ── ambient drift (alive while holding) ──
      tl.fromTo("#s2-dinheiro-drift", { scale: 1 }, { scale: 1.02, duration: 3.04, ease: "none" }, 0.06);

      // ── beat 1: answer tile — two-channel pop (scale spring on .tile-pop, opacity/blur on .tile-fade) + glow bloom ──
      tl.fromTo("#s2-dinheiro-tfade", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, TILE);
      tl.fromTo("#s2-dinheiro-tpop", { scale: 0.5, y: 20 }, { scale: 1, y: 0, duration: 0.5, ease: "back.out(2.2)" }, TILE);
      tl.fromTo("#s2-dinheiro-tglow", { opacity: 0, scale: 0.6 }, { opacity: 0.55, scale: 1, duration: 0.6, ease: "power2.out" }, TILE + 0.04);
      // coin flip on "simples" (own wrapper; rotateY in perspective) + a breath of the glow
      tl.fromTo("#s2-dinheiro-tflip", { rotationY: 0, transformPerspective: 900 },
        { rotationY: 360, transformPerspective: 900, duration: 0.5, ease: "power2.inOut" }, FLIP);
      tl.fromTo("#s2-dinheiro-tglow", { scale: 1 }, { scale: 1.12, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, FLIP + 0.2);
      tl.fromTo("#s2-dinheiro-tpop", { scale: 1 }, { scale: 1.03, duration: EXIT - (TILE + 0.5), ease: "none", immediateRender: false }, TILE + 0.5);

      // ── beat 2: creators slide in from the sides (blur-rise, x instead of y), stagger 0.08 ──
      IN("#s2-dinheiro-c1", CARDS, { x: -120, y: 0, s: 0.96, b: 14, d: 0.5 });
      IN("#s2-dinheiro-c2", CARDS + 0.08, { x: 120, y: 0, s: 0.96, b: 14, d: 0.5 });

      // ── beat 3: money line rises, then counts 0 → 2.000 with dynamic scale (the flex row re-centres as digits grow) ──
      IN("#s2-dinheiro-mrow", MONEY, { y: 50, s: 0.96, b: 14, d: 0.45 });
      const num = q("#s2-dinheiro-num");
      const cnt = { v: 0 }; let shown = "0";
      tl.fromTo(cnt, { v: 0 }, { v: 2000, duration: CNT_D, ease: "power2.out", immediateRender: false,
        onUpdate: () => { const s = fmt(cnt.v); if (s !== shown) { shown = s; num.textContent = s; } } }, CNT);
      tl.fromTo("#s2-dinheiro-dyn", { scale: 0.92 }, { scale: 1, duration: CNT_D, ease: "power2.out" }, CNT);

      // ── "dinheiro": lime block wipes in from the left + the number slams (instant 1.2 then expo settle) ──
      tl.fromTo("#s2-dinheiro-mglow", { opacity: 0, scale: 0.72 }, { opacity: 0.45, scale: 1, duration: 0.5, ease: "power2.out" }, SLAM - 0.04);
      tl.fromTo("#s2-dinheiro-blk", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power3.out" }, SLAM);
      tl.fromTo("#s2-dinheiro-slam", { scale: 1 }, { scale: 1.14, duration: 0.001, ease: "none", immediateRender: false }, SLAM);
      tl.to("#s2-dinheiro-slam", { scale: 1, duration: 0.32, ease: "expo.out" }, SLAM + 0.001);
      // impact shockwave: "até" / "/vídeo" are shoved outward on the hit so the growing block never covers them
      tl.fromTo("#s2-dinheiro-ate", { x: 0 }, { x: -32, duration: 0.001, ease: "none", immediateRender: false }, SLAM);
      tl.to("#s2-dinheiro-ate", { x: 0, duration: 0.34, ease: "power3.out" }, SLAM + 0.001);
      tl.fromTo("#s2-dinheiro-per", { x: 0 }, { x: 32, duration: 0.001, ease: "none", immediateRender: false }, SLAM);
      tl.to("#s2-dinheiro-per", { x: 0, duration: 0.34, ease: "power3.out" }, SLAM + 0.001);
      tl.fromTo("#s2-dinheiro-dyn", { color: "#111113" }, { color: "#141A00", duration: 0.12, ease: "none", immediateRender: false }, SLAM + 0.02);
      tl.fromTo("#s2-dinheiro-slam", { scale: 1 }, { scale: 1.03, duration: EXIT + 0.07 - (SLAM + 0.33), ease: "none", immediateRender: false }, SLAM + 0.33);
      // each creator gets a tiny "+$" chip (spring pop, no filter → back.out is safe)
      tl.fromTo("#s2-dinheiro-plus1", { opacity: 0, scale: 0.4, rotation: -12 }, { opacity: 1, scale: 1, rotation: 6, duration: 0.36, ease: "back.out(2.4)" }, SLAM + 0.04);
      tl.fromTo("#s2-dinheiro-plus2", { opacity: 0, scale: 0.4, rotation: -12 }, { opacity: 1, scale: 1, rotation: 6, duration: 0.36, ease: "back.out(2.4)" }, SLAM + 0.10);

      // ── disclaimer (honest ceiling) ──
      IN("#s2-dinheiro-disc", DISC, { y: 12, s: 0.98, b: 6, d: 0.25 });

      // ── exit: staggered blur-out, money line holds longest (ends 3.12) ──
      OUT("#s2-dinheiro-tx", EXIT, { d: 0.2 });
      tl.to("#s2-dinheiro-tglow", { opacity: 0, duration: 0.2, ease: "power2.in" }, EXIT);
      OUT("#s2-dinheiro-c1", EXIT + 0.02, { d: 0.18 });
      OUT("#s2-dinheiro-c2", EXIT + 0.05, { d: 0.18 });
      OUT("#s2-dinheiro-disc", EXIT + 0.07, { d: 0.17, s: 1.02 });
      OUT("#s2-dinheiro-mrow", EXIT + 0.07, { d: 0.17 });
      tl.to("#s2-dinheiro-mglow", { opacity: 0, duration: 0.17, ease: "power2.in" }, EXIT + 0.07);

      window.__timelines["s2-dinheiro"] = tl;
    })();
  </script>
</template>
