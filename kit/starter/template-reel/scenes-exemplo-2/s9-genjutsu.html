  <script>
    (function () {
      /* s9-genjutsu — global 46.633 → 54.600 (7.967s). Cues are scene-local word starts.
         Window (window-local px; global = +70, +1000): 940x720 dark card. Header 92. Genjutsu tab centre (842, 46).
         State A (MEUS PROJETOS): 3 portrait tiles of the creator's own character 284x504 at left 30/326/622, top 156.
         State B: labels top 104; SEU VÍDEO slot 102..502 x 140..610 (centre 302,375); PERSONAGEM slot 538..838 x 140..610;
         Gerar 658..838 x 626..686 (centre 748,656 -> global 818,1656). Popover 41..563 x 196..546, thumbs 150x267 at
         left 61/227/393, top 258 (centre y 391.5). Exit ends 7.92 < 7.934 (last frame). No hand-off: s10 enters fresh. */
      const R = document.getElementById("s9-genjutsu-root");
      const q = (s) => R.querySelector(s), qa = (s) => Array.from(R.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const IN = (el, t, o = {}) => tl.fromTo(el,
        { opacity: 0, y: o.y ?? 70, x: o.x ?? 0, scale: o.s ?? 0.94, filter: `blur(${o.b ?? 16}px)` },
        { opacity: 1, y: 0, x: 0, scale: 1, filter: "blur(0px)", duration: o.d ?? 0.5, ease: o.e ?? "power3.out" }, t);
      const OUT = (el, t, o = {}) => tl.fromTo(el, { opacity: 1, scale: 1, filter: "blur(0px)" },
        { opacity: 0, scale: o.s ?? 1.04, filter: `blur(${o.b ?? 14}px)`, duration: o.d ?? 0.26, ease: "power2.in", immediateRender: false }, t);
      const NIR = { immediateRender: false };
      const ft = (el, from, to, t) => tl.fromTo(el, from, Object.assign({}, to, NIR), t);

      /* ---------------- cue grid (scene-local word starts) ---------------- */
      const EU_FUI = 0.66, HIGGS = 1.22, NA_ABA = 1.84, GENJ = 2.20, SELEC = 2.78, ALEAT = 3.96, PEDI = 4.94, FIZ = 5.88, MANIP = 7.00;

      /* ---------------- 0.48 window enters ("eu fui até a higgsfield"), settled by 1.12 ---------------- */
      IN("#s9-genjutsu-in", EU_FUI - 0.18, { y: 140, d: 0.64 });
      IN("#s9-genjutsu-lblA", 0.68, { y: 14, s: 1, b: 6, d: 0.36 });
      qa(".s9-genjutsu-tile").forEach((el, i) => IN(el, 0.70 + i * 0.07, { y: 30, s: 0.96, b: 8, d: 0.44 }));
      // alive while holding: slow sink + breathe for the whole hold
      tl.fromTo("#s9-genjutsu-drift", { y: 0, scale: 1 }, { y: -10, scale: 1.015, duration: 7.92 - 1.12, ease: "none" }, 1.12);

      /* ---------------- 1.16 "higgsfield": header logo pulse ---------------- */
      tl.fromTo("#s9-genjutsu-logo", { scale: 1 }, { scale: 1.18, duration: 0.14, ease: "power2.out", immediateRender: false }, HIGGS - 0.06);
      ft("#s9-genjutsu-logo", { scale: 1.18 }, { scale: 1, duration: 0.34, ease: "back.out(2.4)" }, HIGGS + 0.08);
      ft("#s9-genjutsu-lpulse", { opacity: 0.95, scale: 1 }, { opacity: 0, scale: 1.9, duration: 0.55, ease: "power2.out" }, HIGGS - 0.04);

      /* ---------------- cursor: appears at the window centre, glides to the Genjutsu tab ("na aba") ---------------- */
      const CUR = "#s9-genjutsu-curmove", CF = "#s9-genjutsu-curfade", CP = "#s9-genjutsu-curpress";
      const P_START = { x: 470, y: 400 }, P_TAB = { x: 842, y: 48 }, P_SLOT = { x: 302, y: 392 }, P_REST = { x: 572, y: 540 }, P_BTN = { x: 752, y: 660 };
      tl.set(CUR, { x: P_START.x, y: P_START.y }, 0);
      ft(CF, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 1.56);
      ft(CUR, P_START, Object.assign({}, P_TAB, { duration: 0.34, ease: "power2.inOut" }), NA_ABA - 0.08);
      // click = press-release
      const CLICK = (t) => { ft(CP, { scale: 1 }, { scale: 0.82, duration: 0.07, ease: "power1.in" }, t);
        ft(CP, { scale: 0.82 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t + 0.07); };
      CLICK(GENJ - 0.10);

      /* ---------------- 2.12 "genjutsu": tab activates + sparkle, body crossfades to the Genjutsu panel ---------------- */
      const TAB = GENJ - 0.08;
      ft("#s9-genjutsu-tabI", { color: "#FFFFFF" }, { color: "#8A8A92", duration: 0.2, ease: "power1.inOut" }, TAB);
      ft("#s9-genjutsu-tabG", { color: "#8A8A92" }, { color: "#D4FF3A", duration: 0.16, ease: "power1.out" }, TAB);
      ft("#s9-genjutsu-uline", { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out" }, TAB);
      [["#s9-genjutsu-sp0", 0.00, -22, -10], ["#s9-genjutsu-sp1", 0.03, 18, -14], ["#s9-genjutsu-sp2", 0.05, 0, -22],
       ["#s9-genjutsu-sp3", 0.07, -18, 12], ["#s9-genjutsu-sp4", 0.09, 16, 12]].forEach(([id, d, dx, dy]) => {
        const t = TAB + 0.02 + d;
        ft(id, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power2.out" }, t);
        ft(id, { x: 0, y: 0, rotation: -30 }, { x: dx, y: dy, rotation: 30, duration: 0.42, ease: "power2.out" }, t);
        ft(id, { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power2.in" }, t + 0.2);
      });
      ft("#s9-genjutsu-stA", { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -24, filter: "blur(10px)", duration: 0.24, ease: "power2.in" }, TAB + 0.04);
      ft("#s9-genjutsu-stB", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, TAB + 0.22);

      /* ---------------- cursor clicks the SEU VÍDEO slot -> picker floats up ("selecionei") ---------------- */
      ft(CUR, P_TAB, Object.assign({}, P_SLOT, { duration: 0.32, ease: "power2.inOut" }), 2.28);
      CLICK(2.62);
      ft("#s9-genjutsu-slotV", { borderColor: "#3A3A40" }, { borderColor: "#D4FF3A", duration: 0.16, ease: "power1.out" }, 2.66);
      ft(CF, { opacity: 1, x: 0, y: 0 }, { opacity: 0, x: 36, y: 54, duration: 0.24, ease: "power2.in" }, 2.94);

      IN("#s9-genjutsu-pop", SELEC - 0.10, { y: 60, s: 0.92, b: 14, d: 0.45 });
      ["#s9-genjutsu-th0", "#s9-genjutsu-th1", "#s9-genjutsu-th2"].forEach((id, i) => IN(id, SELEC - 0.02 + i * 0.06, { y: 34, s: 0.9, b: 10, d: 0.4 }));

      /* ---------------- 3.38–4.00 "um vídeo meu aleatório": the lime ring hops a→b→c→a→b (quickening), lands on the ORIGINAL ---------------- */
      tl.fromTo("#s9-genjutsu-shuf", { color: "#8A8A92", rotation: 0 }, { color: "#D4FF3A", rotation: 180, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 3.36);
      ft("#s9-genjutsu-ringin", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, 3.36);
      ft("#s9-genjutsu-ringin", { scale: 1.14 }, { scale: 1, duration: 0.32, ease: "back.out(2)" }, 3.36);
      const STEP = 166;
      // [start, from slot, to slot, duration] — intervals .16/.12/.08 (quickening); no two hops overlap
      const HOPS = [[3.56, 0, 1, 0.12], [3.72, 1, 2, 0.10], [3.84, 2, 0, 0.075], [3.92, 0, 1, 0.14]];
      HOPS.forEach(([t, a, b, d], i) => {
        const last = i === HOPS.length - 1;
        ft("#s9-genjutsu-ringhop", { x: a * STEP }, { x: b * STEP, duration: d, ease: last ? "back.out(1.6)" : "power2.out" }, t);
        // each hop is a small pop (own wrapper); pop length clipped to the next hop so pops never overlap
        const pd = last ? 0.16 : Math.min(0.12, HOPS[i + 1][0] - t);
        ft("#s9-genjutsu-ringpop", { scale: 1.08 }, { scale: 1, duration: pd, ease: "power2.out" }, t);
      });
      // landing on "aleatório": chosen thumb punches (back to exactly 1 before the FLIP), the others recede
      ft("#s9-genjutsu-thp1", { scale: 1 }, { scale: 1.06, duration: 0.11, ease: "power2.out" }, 4.0);
      ft("#s9-genjutsu-thp1", { scale: 1.06 }, { scale: 1, duration: 0.13, ease: "power2.inOut" }, 4.11);
      ft(["#s9-genjutsu-thc0", "#s9-genjutsu-thc2"], { opacity: 1, filter: "blur(0px)" }, { opacity: 0.4, filter: "blur(2px)", duration: 0.25, ease: "power2.out" }, 4.0);

      /* ---------------- 4.25 FLIP: the chosen thumb fills the SEU VÍDEO slot (one element, transform + clip-path) ---------------- */
      // start pose == the thumb on screen: centre (302, 391.5) vs slot centre (302, 375); 400x711.11 at scale .375 = 150x266.7;
      // clip radius 16 / .375 so the corners read as the thumb's 16px
      const FL0 = 4.25, FLD = 0.45, S0 = 150 / 400;
      tl.set("#s9-genjutsu-thc1", { opacity: 0 }, FL0);
      tl.set("#s9-genjutsu-vm", { opacity: 1 }, FL0);
      tl.fromTo("#s9-genjutsu-vm",
        { x: 0, y: 391.5 - 375, scale: S0, clipPath: `inset(0px 0px 0px 0px round ${16 / S0}px)` },
        { x: 0, y: 0, scale: 1, clipPath: "inset(120.555px 0px 120.555px 0px round 22px)", duration: FLD, ease: "power3.inOut", force3D: false, immediateRender: false }, FL0);
      OUT("#s9-genjutsu-pop", FL0, { d: 0.24, s: 1.03, b: 12 });
      // the dashed drop-target dissolves under the landing video (its lime dashes fringed the clip edge before)
      ft("#s9-genjutsu-slotV", { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.inOut" }, FL0 + FLD - 0.2);
      ft("#s9-genjutsu-flash", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, FL0 + FLD - 0.06);
      ft("#s9-genjutsu-flash", { opacity: 1 }, { opacity: 0, duration: 0.36, ease: "power2.inOut" }, FL0 + FLD + 0.08);

      /* ---------------- 4.55 still -> video takeover (media-start 0.5 = the thumb's exact frame) ---------------- */
      ft("#s9-genjutsu-vvid", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.inOut" }, 4.55);
      ft("#s9-genjutsu-vkb", { scale: 1 }, { scale: 1.05, duration: 7.92 - (FL0 + FLD), ease: "none" }, FL0 + FLD);

      /* ---------------- 4.84 "pedi": PERSONAGEM slot fills (two-channel pop: fade/blur power2, scale back.out) ---------------- */
      ft("#s9-genjutsu-pin", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, PEDI - 0.12);
      ft("#s9-genjutsu-pscale", { scale: 0.8 }, { scale: 1, duration: 0.46, ease: "back.out(1.8)" }, PEDI - 0.12);
      // the empty PERSONAGEM placeholder ("escolher" + dashed border) clears so it never shows through the fading portrait
      ft("#s9-genjutsu-slotP", { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power1.in" }, PEDI - 0.24);
      ft("#s9-genjutsu-pkb", { scale: 1 }, { scale: 1.04, duration: 7.92 - PEDI, ease: "none" }, PEDI);

      /* ---------------- 5.30 Gerar wakes; cursor glides to it; 5.80 "fizesse" click ---------------- */
      ft("#s9-genjutsu-gwake", { opacity: 0.35 }, { opacity: 1, duration: 0.24, ease: "power1.out" }, 5.3);
      ft("#s9-genjutsu-gglow", { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power2.out" }, 5.3);
      tl.set(CUR, { x: P_REST.x, y: P_REST.y }, 5.16);
      ft(CF, { opacity: 0, x: 0, y: 0, scale: 0.8 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.16, ease: "power2.out" }, 5.16);
      ft(CUR, P_REST, Object.assign({}, P_BTN, { duration: 0.4, ease: "power2.inOut" }), 5.32);
      const CLK = FIZ - 0.10;
      CLICK(CLK);
      ft("#s9-genjutsu-gbtn", { scale: 1 }, { scale: 0.9, duration: 0.08, ease: "power1.in" }, CLK);
      ft("#s9-genjutsu-gbtn", { scale: 0.9 }, { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, CLK + 0.08);
      ft("#s9-genjutsu-gburst", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.4, duration: 0.5, ease: "power2.out" }, CLK + 0.08);
      // small radial lime burst: 8 dots, deterministic angles, one proxy drives them all (opacity 0 at T=0 for back-seeks)
      const field = q("#s9-genjutsu-gdots"), dots = [];
      for (let i = 0; i < 8; i++) {
        const el = document.createElement("i"); el.className = "gd"; field.appendChild(el);
        const a = (i / 8) * Math.PI * 2 + 0.2;
        dots.push({ el, ax: Math.cos(a) * 130, ay: Math.sin(a) * 58 });     // elliptical spread hugging the pill shape
      }
      const bd = { T: 0 };
      tl.fromTo(bd, { T: 0 }, { T: 1, duration: 0.5, ease: "none", immediateRender: false, onUpdate: () => {
        const e = 1 - Math.pow(1 - bd.T, 3);
        const op = bd.T === 0 ? 0 : (bd.T < 0.15 ? bd.T / 0.15 : Math.max(0, 1 - (bd.T - 0.15) / 0.85));
        dots.forEach((d) => { d.el.style.transform = `translate(${(d.ax * e).toFixed(2)}px, ${(d.ay * e).toFixed(2)}px) scale(${(1 - 0.5 * bd.T).toFixed(3)})`;
          d.el.style.opacity = op.toFixed(3); });
      } }, CLK + 0.08);
      ft(CF, { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power2.in" }, 6.08);

      /* ---------------- 6.15 attention moves to the video: rest of the panel recedes, camera pushes in on the slot ---------------- */
      ft("#s9-genjutsu-rest", { opacity: 1, filter: "blur(0px)" }, { opacity: 0.42, filter: "blur(3px)", duration: 0.5, ease: "power2.out" }, 6.15);
      ft("#s9-genjutsu-push", { scale: 1 }, { scale: 1.04, duration: 7.68 - 6.15, ease: "sine.inOut" }, 6.15);

      /* ---------------- 6.85 "manipulação": scan line (3 finite passes) + lime shimmer + counting pill ---------------- */
      ft("#s9-genjutsu-shim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, MANIP - 0.15);
      ft("#s9-genjutsu-scan", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, MANIP - 0.14);
      ft("#s9-genjutsu-scan", { y: -70 }, { y: 470, duration: 0.3, ease: "power1.inOut", repeat: 2 }, MANIP - 0.14);
      ft("#s9-genjutsu-pill", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.24, ease: "power2.out" }, MANIP - 0.15);
      ft("#s9-genjutsu-pillsc", { scale: 0.7, y: 10 }, { scale: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, MANIP - 0.15);
      ft("#s9-genjutsu-spin", { rotation: 0 }, { rotation: 720, svgOrigin: "13 13", duration: 1.1, ease: "none" }, MANIP - 0.15);
      const pct = q("#s9-genjutsu-pct"), pc = { v: 0 }; let lastP = -1;
      tl.fromTo(pc, { v: 0 }, { v: 87, duration: 0.95, ease: "power1.out", immediateRender: false,
