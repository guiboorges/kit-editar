         Tile pose P0 = s7's skeleton tile (130,1430) 400x190 r20 = P1 scaled x0.8 about its centre, clipped vertically. */
      const CX = 540, CY = 1290, BW = 900, BH = 509;
      const POR = { l: 80, t: 1010, w: 500, h: 544 };
      const S1 = 101 / 92.5;
      const X1 = 340.5 - CX - (244.75 - BW / 2) * S1, Y1 = 1161 - CY - (140.25 - BH / 2) * S1;
      const toBoxX = (sx, s, x) => (sx - CX - x) / s + BW / 2, toBoxY = (sy, s, y) => (sy - CY - y) / s + BH / 2;
      const PL = toBoxX(POR.l, S1, X1), PT = toBoxY(POR.t, S1, Y1), PW = POR.w / S1, PH = POR.h / S1;
      const P1 = { x: X1, y: Y1, scale: S1, clipPath: `inset(${PT.toFixed(3)}px ${(BW - PL - PW).toFixed(3)}px ${(BH - PT - PH).toFixed(3)}px ${PL.toFixed(3)}px round ${(34 / S1).toFixed(3)}px)` };
      const S0 = S1 * 0.8;                                         // tile 400 wide = portrait 500 x 0.8
      const VH = 190 / S0, PCX = PL + PW / 2, PCY = PT + PH / 2;    // visible tile band, centred on the portrait centre
      const X0 = 330 - CX - (PCX - BW / 2) * S0, Y0 = 1525 - CY - (PCY - BH / 2) * S0;
      const P0 = { x: X0, y: Y0, scale: S0, clipPath: `inset(${(PCY - VH / 2).toFixed(3)}px ${(BW - PL - PW).toFixed(3)}px ${(BH - PCY - VH / 2).toFixed(3)}px ${PL.toFixed(3)}px round ${(20 / S0).toFixed(3)}px)` };
      const PF = { x: 0, y: 0, scale: 1, clipPath: "inset(0px 0px 0px 0px round 34px)" };
      // static layout of the portrait layer inside the box (set once, never animated)
      const por = q("#s8-avatar-por");
      Object.assign(por.style, { left: PL + "px", top: PT + "px", width: PW + "px", height: PH + "px" });
      q("#s8-avatar-flash").style.borderRadius = (34 / S1) + "px";
      q("#s8-avatar-flash").style.boxShadow = `inset 0 0 0 ${(8 / S1).toFixed(2)}px #D4FF3A`;
      // skeleton overlay glyph: 54 screen px centred, at the tile pose scale
      const g = q("#s8-avatar-tov svg"), GS = 54 / S0;
      Object.assign(g.style, { width: GS + "px", height: GS + "px", left: (PW / 2 - GS / 2) + "px", top: (PH / 2 - GS / 2) + "px" });
      q("#s8-avatar-tsheen2").style.width = (200 / S0) + "px";

      /* ================= 0.00–0.06 replica holds; 0.06 the card grows out of the skeleton tile ("especifiquei") ================= */
      // replica shimmer continues s7's linear pass: x = -68 + 1200*t
      tl.fromTo("#s8-avatar-tsheen", { x: -68 }, { x: -68 + 1200 * 0.06, duration: 0.06, ease: "none" }, 0);
      const G0 = 0.06, GD = 0.5;
      tl.set("#s8-avatar-tile", { opacity: 0 }, G0);
      tl.set("#s8-avatar-cardshadow", { opacity: 1 }, G0);
      tl.to("#s8-avatar-winbox", { opacity: 0, scale: 1.03, filter: "blur(14px)", duration: 0.3, ease: "power2.out" }, 0.03);
      tl.fromTo("#s8-avatar-card", { ...P0 }, { ...P1, duration: GD, ease: "power3.out", force3D: false }, G0);
      // the skeleton look dissolves while the image resolves (same shimmer, now in the card's own px)
      tl.fromTo("#s8-avatar-tsheen2", { x: (-68 + 1200 * G0) / S0 }, { x: 460 / S0, duration: (460 - (-68 + 1200 * G0)) / 1200, ease: "none", immediateRender: false }, G0);
      tl.fromTo("#s8-avatar-tov", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.inOut", immediateRender: false }, G0 + 0.04);
      tl.fromTo("#s8-avatar-porimg", { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, G0);
      // lime flash border on arrival
      tl.fromTo("#s8-avatar-flash", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out", immediateRender: false }, G0 + 0.34);
      tl.to("#s8-avatar-flash", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, G0 + 0.62);
      // Ken Burns on the portrait (reset under the morph so the faces stay registered)
      tl.fromTo("#s8-avatar-porkb", { scale: 1 }, { scale: 1.04, duration: E2 - (G0 + GD), ease: "none", force3D: false }, G0 + GD);
      tl.fromTo("#s8-avatar-porkb", { scale: 1.04 }, { scale: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false, force3D: false }, E2);
      // whole stage drifts up slowly (alive while holding)
      tl.fromTo("#s8-avatar-drift", { y: 0 }, { y: -12, duration: 5.5 - (G0 + GD), ease: "none", force3D: false }, G0 + GD);

      /* ================= "como eu queria" — spec slots wait as skeletons; each one is replaced by its chip ================= */
      const COMO = 1.04;
      IN("#s8-avatar-speclbl", COMO - 0.12, { y: 12, s: 1, b: 6, d: 0.3 });
      ["#s8-avatar-k1", "#s8-avatar-k2", "#s8-avatar-k3"].forEach((id, i) => {
        IN(id, COMO - 0.08 + i * 0.07, { y: 0, x: -18, s: 0.96, b: 8, d: 0.36 });
        tl.fromTo(id + " i", { opacity: 1 }, { opacity: 0.45, duration: 0.32, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, COMO + 0.3 + i * 0.07);
      });
      [["#s8-avatar-k1", CABELO], ["#s8-avatar-k2", COR], ["#s8-avatar-k3", TAMANHO]].forEach(([id, t]) =>
        tl.to(id, { opacity: 0, duration: 0.14, ease: "power1.in" }, t - 0.06));
      OUT("#s8-avatar-speclbl", TAMANHO - 0.2, { d: 0.2, s: 1 });   // clears before the measure bracket draws past it

      /* ================= "cabelo" — a lime scan band passes down the hair and leaves a selection contour + chip + leader =================
         (the hair keeps its real lilac colour: no flat lime fill sitting on it) */
      const SW0 = CABELO - 0.14, SWD = 0.44;
      // scan band: [top, lower] = [86p%, 100p%] of the hair, lower edge synced with the contour reveal (same ease/duration)
      tl.fromTo("#s8-avatar-hmL", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(86% 0% 0% 0%)", duration: SWD, ease: "power1.inOut", immediateRender: false }, SW0);
      tl.fromTo("#s8-avatar-hmL", { opacity: 0 }, { opacity: 0.55, duration: 0.1, ease: "power1.out", immediateRender: false }, SW0);
      tl.to("#s8-avatar-hmL", { opacity: 0, duration: 0.14, ease: "power1.in" }, SW0 + SWD - 0.08);
      tl.fromTo("#s8-avatar-hmE", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: SWD, ease: "power1.inOut", immediateRender: false }, SW0);
      tl.fromTo("#s8-avatar-hmE", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none", immediateRender: false }, SW0);
      POP("#s8-avatar-c1", CABELO - 0.1, { from: 0.7, x: -18, d: 0.42, e: "back.out(1.8)" });
      DRAW(["#s8-avatar-l1u", "#s8-avatar-l1"], CABELO - 0.02, 0.26);
      DOT("#s8-avatar-d1", CABELO + 0.2);

      /* ================= "cor" — the hair flashes its colour; swatch chip ================= */
      tl.to("#s8-avatar-hmE", { opacity: 0, duration: 0.2, ease: "power2.in" }, COR - 0.1);
      tl.fromTo("#s8-avatar-hmC", { opacity: 0 }, { opacity: 0.7, duration: 0.22, ease: "power2.out", immediateRender: false }, COR - 0.1);
      tl.to("#s8-avatar-hmC", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, COR + 0.26);
      POP("#s8-avatar-c2", COR - 0.1, { from: 0.7, x: -18, d: 0.42, e: "back.out(1.8)" });
      tl.fromTo("#s8-avatar-swc", { scale: 0.3 }, { scale: 1, duration: 0.36, ease: "back.out(2.6)", immediateRender: false }, COR - 0.02);
      DRAW(["#s8-avatar-l2u", "#s8-avatar-l2"], COR - 0.02, 0.24);
      DOT("#s8-avatar-d2", COR + 0.18);
      tl.to(["#s8-avatar-c1", "#s8-avatar-g1"], { opacity: 0.45, duration: 0.3, ease: "power2.out" }, COR - 0.1);

      /* ================= "tamanho" — measure bracket hair top -> shoulder; earlier leaders retract ================= */
      tl.to(["#s8-avatar-l1u", "#s8-avatar-l1", "#s8-avatar-l2u", "#s8-avatar-l2"], { strokeDashoffset: 100, duration: 0.2, ease: "power2.in" }, TAMANHO - 0.18);
      tl.to(["#s8-avatar-d1", "#s8-avatar-d2"], { opacity: 0, duration: 0.14, ease: "power2.in" }, TAMANHO - 0.18);
      tl.to("#s8-avatar-c2", { opacity: 0.45, duration: 0.3, ease: "power2.out" }, TAMANHO - 0.1);
      DOT("#s8-avatar-tk0", TAMANHO - 0.14, 0.26);
      DRAW(["#s8-avatar-bru", "#s8-avatar-br"], TAMANHO - 0.1, 0.4, "power2.inOut");
      DOT("#s8-avatar-tk1", TAMANHO + 0.24, 0.3);
      tl.fromTo("#s8-avatar-guide", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, TAMANHO + 0.28);
      POP("#s8-avatar-c3", TAMANHO - 0.1, { from: 0.7, x: -18, d: 0.42, e: "back.out(1.8)" });
      DRAW("#s8-avatar-l3", TAMANHO + 0.06, 0.16);

      /* ================= "e até mesmo" — callouts clear; portrait card morphs into the full sheet ================= */
      OUT("#s8-avatar-lines", E2 - 0.04, { d: 0.22, s: 1 });
      OUT("#s8-avatar-c3", E2 - 0.02, { d: 0.22, s: 0.96 });
      OUT("#s8-avatar-c2", E2 + 0.02, { d: 0.22, s: 0.96 });
      OUT("#s8-avatar-c1", E2 + 0.06, { d: 0.22, s: 0.96 });
      const M0 = ATE - 0.02, MD = 0.55;
      tl.set("#s8-avatar-sheet", { opacity: 1 }, M0);
      tl.fromTo("#s8-avatar-card", { ...P1 }, { x: 0, y: 0, scale: 1, clipPath: PF.clipPath, duration: MD, ease: "power2.inOut", immediateRender: false, force3D: false }, M0);
      tl.fromTo("#s8-avatar-por", { opacity: 1 }, { opacity: 0, duration: 0.32, ease: "power1.inOut", immediateRender: false }, M0 + 0.14);

      /* ================= "aparência" — capsule ring on the full-body figure + look tags ================= */
      tl.fromTo("#s8-avatar-bring", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(1.8)", immediateRender: false }, APAR - 0.12);
      // tags: 5.08 / 5.14 / 5.20, 0.34s each -> the last one SETTLES at 5.54, exactly when the exit starts (no two tweens on one tag at once)
      ["#s8-avatar-t1", "#s8-avatar-t2", "#s8-avatar-t3"].forEach((id, i) => POP(id, APAR - 0.14 + i * 0.06, { from: 0.6, y: 12, d: 0.34, e: "back.out(2.2)" }));

      /* ================= EXIT (all end by 5.75 < last frame 5.767) ================= */
      OUT(["#s8-avatar-t1", "#s8-avatar-t2", "#s8-avatar-t3"], 5.54, { d: 0.2 });
      OUT("#s8-avatar-bring", 5.54, { d: 0.2 });
      OUT("#s8-avatar-cardexit", 5.55, { d: 0.2 });

      window.__timelines["s8-avatar"] = tl;
    })();
  </script>
