  <script>
    (function () {
      const R = document.getElementById("s5-ciclo-root");
      const q = (s) => R.querySelector(s), qa = (s) => Array.from(R.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const OUT = (el, t, o = {}) => tl.to(el, Object.assign({ opacity: 0, scale: o.s ?? 1.04, filter: `blur(${o.b ?? 14}px)`,

      // ── cue grid (scene-local word starts). Camera is full-screen until 0.14 and uncovers the stage 0.14-0.50 ──
      const PAGAR = 0.44, INFL = 1.10, USAR = 2.14, SERV1 = 2.60, ELA = 3.56, PAGA = 3.84, PESSOAS = 4.34, USAREM = 4.88,
            SERV2 = 5.97, E = 6.73, GERADOS = 7.25, ELA2 = 7.91, MESMO = 8.09;
      const EXIT = 8.12;   // blur-out 0.26s → ends 8.38 (< 8.433 − 1 frame)
      const P = 1200;      // shared perspective for the book-open tilt

      // ── geometry (pre-computed) ──
      const LC = { x: 300, y: 1350 }, RC = { x: 780, y: 1350 }, STAGE_X = 240;   // card slot centres; L staged at centre (+240)
      const L_IN = 0.10, L_IN_D = 0.55, SPLIT = 3.42;
      const LSCL0 = L_IN + L_IN_D, LSCL1 = 1.03;                                 // staged hold scale 1 → 1.03 (0.65 → SPLIT)
      const lsclAt = (t) => 1 + (LSCL1 - 1) * Math.min(Math.max((t - LSCL0) / (SPLIT - LSCL0), 0), 1);
      // cubic bezier with an arc-length table → a coin moves along the exact curve its trail draws
      const mkPath = (p0, c1, c2, p3) => {
        const N = 240, pts = [], acc = [0];
        const at = (t) => { const u = 1 - t; return {
          x: u * u * u * p0.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t * t * t * p3.x,
          y: u * u * u * p0.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t * t * t * p3.y }; };
        for (let i = 0; i <= N; i++) { pts.push(at(i / N)); if (i) acc.push(acc[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y)); }
        const len = acc[N];
        const pointAt = (u) => { const target = Math.min(Math.max(u, 0), 1) * len; let i = 1; while (i < N && acc[i] < target) i++;
          const seg = acc[i] - acc[i - 1] || 1, f = (target - acc[i - 1]) / seg;
          return { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * f, y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * f }; };
        const f2 = (n) => n.toFixed(2);
        return { len, pointAt, d: `M ${f2(p0.x)} ${f2(p0.y)} C ${f2(c1.x)} ${f2(c1.y)} ${f2(c2.x)} ${f2(c2.y)} ${f2(p3.x)} ${f2(p3.y)}` };
      };

      const pay = q("#s5-ciclo-pay"), payPos = q("#s5-ciclo-paypos"), payPunch = q("#s5-ciclo-paypunch");
      const L = q("#s5-ciclo-L"), Lscl = q("#s5-ciclo-Lscl"), Lflt = q("#s5-ciclo-Lflt"), Lcard = q("#s5-ciclo-Lcard");
      const Rr = q("#s5-ciclo-R"), Rscl = q("#s5-ciclo-Rscl"), Rflt = q("#s5-ciclo-Rflt");
      const Lgrp = q("#s5-ciclo-Lgrp"), Rgrp = q("#s5-ciclo-Rgrp"), Lsub = q("#s5-ciclo-Lsub"), Rsub = q("#s5-ciclo-Rsub"), Llogo = q("#s5-ciclo-Llogo");
      const strikeSvg = q("#s5-ciclo-strikesvg"), strike = q("#s5-ciclo-strike"), xd = q("#s5-ciclo-x");
      const ring = q("#s5-ciclo-ring"), pulse = q("#s5-ciclo-pulse");

      /* ---- 1. payer chip + the influencer card arrives alone, staged at the centre (already moving when uncovered) ---- */
      tl.fromTo(L, { opacity: 0, x: STAGE_X, y: 80, scale: 0.94, rotationY: 10, transformPerspective: P, filter: "blur(16px)" },
        { opacity: 1, x: STAGE_X, y: 0, scale: 1, rotationY: 0, transformPerspective: P, filter: "blur(0px)", duration: L_IN_D, ease: "power3.out" }, L_IN);
      tl.fromTo(Lscl, { scale: 1 }, { scale: LSCL1, duration: SPLIT - LSCL0, ease: "none" }, LSCL0);
      tl.fromTo(pay, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, 0.20);
      tl.fromTo(pay, { scale: 0.5, y: 14 }, { scale: 1, y: 0, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, 0.20);
      tl.fromTo(payPos, { y: 0 }, { y: -8, duration: EXIT - 0.7, ease: "none" }, 0.7);

      /* ---- 2. "pagar pro influencer": a lime coin leaves the chip along a self-drawing dotted path and lands on the card ---- */
      const L_GO = PAGAR + 0.06, L_D = 0.54, L_LAND = L_GO + L_D;                 // 0.50 → 1.04 (lands on "influencer")
      const lLocal = { x: 138, y: 222 };                                          // landed coin centre, card-local
      const sL = lsclAt(L_LAND);
      const lEnd = { x: LC.x + STAGE_X + (lLocal.x - 210) * sL, y: LC.y + (lLocal.y - 280) * sL };
      const pathL = mkPath({ x: 528, y: 1012 }, { x: 420, y: 1070 }, { x: 392, y: 1222 }, lEnd);

      const RL = [{ x: 186, y: 126 }, { x: 314, y: 126 }, { x: 186, y: 254 }, { x: 314, y: 254 }];  // R landed coins, card-local
      const R_GO = [3.70, 3.80, 3.90, 4.00], R_D = 0.34;                          // land 4.04 … 4.34 ("pessoas")
      const pathsR = RL.map((c) => { const ex = RC.x - 210 + c.x, ey = RC.y - 280 + c.y;
        return mkPath({ x: 552, y: 1012 }, { x: ex * 0.45 + 552 * 0.55, y: 1030 }, { x: ex, y: ey - 110 }, { x: ex, y: ey }); });

      [["#s5-ciclo-pL", "#s5-ciclo-mkLp", pathL], ["#s5-ciclo-pR", "#s5-ciclo-mkRp", pathsR[0]]].forEach(([vis, mk, p]) => {
        q(vis).setAttribute("d", p.d); const m = q(mk); m.setAttribute("d", p.d);
        m.setAttribute("stroke-dasharray", `${p.len.toFixed(2)} ${p.len.toFixed(2)}`); m.setAttribute("stroke-dashoffset", p.len.toFixed(2));
      });

      // travelling coin: one writer per coin owns its .tc transform (pure function of the proxy → seek-safe)
      const travel = (tcSel, path, size, s1, t0, d, trailMask) => {
        const tc = q(tcSel), tcf = q(tcSel + "f"), o = { p: 0 };
        const paint = () => { const pt = path.pointAt(o.p), s = 1 + (s1 - 1) * o.p;
          tc.style.transform = `translate(${(pt.x - size / 2).toFixed(2)}px, ${(pt.y - size / 2).toFixed(2)}px) scale(${s.toFixed(4)})`; };
        paint();
        tl.fromTo(tcf, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, t0 - 0.06);
        tl.fromTo(tcf, { scale: 0.5 }, { scale: 1, duration: 0.22, ease: "back.out(2)" }, t0 - 0.06);
        tl.fromTo(o, { p: 0 }, { p: 1, duration: d, ease: "power2.inOut", immediateRender: false, onUpdate: paint }, t0);
        if (trailMask) tl.fromTo(trailMask, { strokeDashoffset: path.len }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t0);
        tl.to(tcf, { opacity: 0, duration: 0.001, ease: "none" }, t0 + d);   // hand-off to the landed coin on the same frame
      };
      const land = (sel, t) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, t);
        tl.fromTo(sel, { scale: 1 }, { scale: 1.28, duration: 0.08, ease: "power2.out" }, t);
        tl.to(sel, { scale: 1, duration: 0.26, ease: "back.out(2.5)" }, t + 0.08);
      };
      travel("#s5-ciclo-tcL", pathL, 64, 1, L_GO, L_D, q("#s5-ciclo-mkLp"));
      land("#s5-ciclo-lcL", L_LAND);
      // the chip "pays": a small punch as the coin leaves
      tl.fromTo(payPunch, { scale: 1 }, { scale: 1.07, duration: 0.1, ease: "power2.out" }, PAGAR - 0.04);
      tl.to(payPunch, { scale: 1, duration: 0.26, ease: "power2.inOut" }, PAGAR + 0.06);
      tl.fromTo(Lflt, { y: 0 }, { y: -8, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.12);

      /* ---- 3. "usar os seus serviços": body re-lays (group glides up), sub arrives; Higgsfield mark pops on "serviços" ---- */
      tl.fromTo(Lgrp, { y: 40 }, { y: 0, duration: 0.45, ease: "power3.inOut" }, USAR - 0.16);
      tl.fromTo(Lsub, { opacity: 0, y: 20, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out" }, USAR - 0.10);
      // the mark arrives with the sub line, then punches + spins on "serviços" (no hole in the sentence)
      tl.fromTo(Llogo, { scale: 1, rotation: 0 }, { scale: 1.45, rotation: -14, duration: 0.12, ease: "power2.out" }, SERV1 - 0.1);
      tl.to(Llogo, { scale: 1, rotation: 0, duration: 0.32, ease: "back.out(2.2)" }, SERV1 + 0.02);

      /* ---- 4. "ela paga pra pessoas": split — influencer to the left slot and struck out; pessoas flies in; coins re-route ---- */
      tl.to("#s5-ciclo-trL", { opacity: 0, duration: 0.2, ease: "power2.in" }, SPLIT - 0.06);
      tl.to(L, { x: 0, rotationY: 4, duration: 0.5, ease: "power3.out" }, SPLIT);
      tl.to(Lscl, { scale: 0.92, duration: 0.45, ease: "power3.out" }, SPLIT);
      tl.fromTo(Rr, { opacity: 0, x: 80, y: 60, scale: 0.94, rotationY: -10, transformPerspective: P, filter: "blur(16px)" },
        { opacity: 1, x: 0, y: 0, scale: 1, rotationY: 0, transformPerspective: P, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, SPLIT + 0.04);
      // strike (hidden until the draw starts: a round cap at full dash offset would leave a dot)
      const STRIKE = 3.62;
      tl.fromTo(strikeSvg, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, STRIKE);
      tl.fromTo(strike, { strokeDashoffset: 604.95 }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, STRIKE);
      tl.fromTo(Lcard, { filter: "grayscale(0)", opacity: 1 }, { filter: "grayscale(1)", opacity: 0.55, duration: 0.4, ease: "power2.out" }, STRIKE + 0.02);

      tl.to(payPunch, { scale: 1, duration: 0.26, ease: "power2.inOut" }, PAGA);

      ["#s5-ciclo-tc0", "#s5-ciclo-tc1", "#s5-ciclo-tc2", "#s5-ciclo-tc3"].forEach((sel, i) => {
        travel(sel, pathsR[i], 52, 44 / 52, R_GO[i], R_D, i === 0 ? q("#s5-ciclo-mkRp") : null);
        land("#s5-ciclo-lc" + i, R_GO[i] + R_D);
      });
      tl.fromTo(Rflt, { y: 0 }, { y: -8, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.40);
      // the struck-out card keeps sinking slowly (no dead hold between the strike and the exit)
      tl.fromTo(Lflt, { y: 0 }, { y: 12, duration: E - 0.11 - 3.92, ease: "none", immediateRender: false }, 3.92);

      /* ---- 5. "usarem os seus serviços": right body re-lays; "serviços" → winner: lime ring hug + scale + nudge to centre ---- */
      tl.fromTo(Rgrp, { y: 40 }, { y: 0, duration: 0.45, ease: "power3.inOut" }, USAREM - 0.14);

      const WIN = SERV2 - 0.11;   // 5.86

      tl.fromTo(ring, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.38, ease: "back.out(2)" }, WIN + 0.02);
      tl.fromTo(pulse, { opacity: 0, scale: 1 }, { opacity: 0.9, scale: 1, duration: 0.01, ease: "none" }, WIN + 0.10);
      tl.to(pulse, { opacity: 0, scale: 1.12, duration: 0.6, ease: "power2.out" }, WIN + 0.11);
      tl.fromTo(Rscl, { scale: 1.06 }, { scale: 1.07, duration: 0.26, ease: "none", immediateRender: false }, WIN + 0.5);

      /* ---- 6. "e são gerados por ela mesmo": cards + trails leave; the cycle — Higgsfield tile ⇄ video it generated ---- */
      const PART = E - 0.11;   // 6.62
      tl.to(L, { opacity: 0, x: -80, filter: "blur(14px)", duration: 0.26, ease: "power2.in" }, PART);
      tl.to(Rr, { opacity: 0, x: 40, filter: "blur(14px)", duration: 0.26, ease: "power2.in" }, PART);

      const tpos = q("#s5-ciclo-tpos"), tscl = q("#s5-ciclo-tscl"), tpunch = q("#s5-ciclo-tpunch"), tpulse = q("#s5-ciclo-tpulse");
      const vpos = q("#s5-ciclo-vpos"), vchip = q("#s5-ciclo-vchip");
      const PAY0 = 6.80;
      // tile: two-channel pop (opacity/blur on power2.out, scale on back.out on a separate wrapper)
      tl.fromTo(tpos, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, PAY0);
      tl.fromTo(tscl, { scale: 0.5 }, { scale: 1, duration: 0.5, ease: "back.out(1.8)" }, PAY0);
      tl.fromTo(tscl, { scale: 1 }, { scale: 1.03, duration: EXIT - (PAY0 + 0.5), ease: "none", immediateRender: false }, PAY0 + 0.5);
      // video card: blur-rise; Ken Burns on its own wrapper (never the <video> box)
      tl.fromTo(vpos, { opacity: 0, y: 70, scale: 0.94, filter: "blur(16px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, PAY0 + 0.06);
      tl.fromTo("#s5-ciclo-vkb", { scale: 1.08 }, { scale: 1, duration: EXIT + 0.26 - (PAY0 + 0.06), ease: "none" }, PAY0 + 0.06);
      tl.fromTo("#s5-ciclo-vflt", { y: 0 }, { y: -8, duration: EXIT - (PAY0 + 0.56), ease: "none" }, PAY0 + 0.56);
      tl.fromTo(vchip, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, 7.02);
      tl.fromTo(vchip, { scale: 0.5, y: 8 }, { scale: 1, y: 0, duration: 0.36, ease: "back.out(2)" }, 7.02);

      // loop arrows: two quadratic arcs (tile → video "gera o vídeo", video → tile "paga quem posta")
      const arcT = q("#s5-ciclo-arcT"), arcB = q("#s5-ciclo-arcB"), headT = q("#s5-ciclo-headT"), headB = q("#s5-ciclo-headB");
      const quad = (a, c, b) => mkPath(a, { x: a.x + (2 / 3) * (c.x - a.x), y: a.y + (2 / 3) * (c.y - a.y) },
        { x: b.x + (2 / 3) * (c.x - b.x), y: b.y + (2 / 3) * (c.y - b.y) }, b);
      const AT = { a: { x: 372, y: 1204 }, c: { x: 505, y: 1060 }, b: { x: 634, y: 1176 } };
      const AB = { a: { x: 640, y: 1404 }, c: { x: 505, y: 1540 }, b: { x: 380, y: 1382 } };
      const arcs = [[arcT, headT, quad(AT.a, AT.c, AT.b), AT, 7.15], [arcB, headB, quad(AB.a, AB.c, AB.b), AB, 7.60]];
      arcs.forEach(([el, head, p, g, t0]) => {
        el.setAttribute("d", p.d); el.setAttribute("stroke-dasharray", `${p.len.toFixed(2)} ${p.len.toFixed(2)}`);
        el.setAttribute("stroke-dashoffset", p.len.toFixed(2));
        const ang = Math.atan2(g.b.y - g.c.y, g.b.x - g.c.x) * 180 / Math.PI;
        head.style.left = (g.b.x - 4).toFixed(2) + "px"; head.style.top = (g.b.y - 13).toFixed(2) + "px";
        tl.fromTo(el, { strokeDashoffset: p.len }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, t0);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, t0 + 0.02);   // after the draw starts (no lone cap dot)
        tl.fromTo(head, { opacity: 0, scale: 0, rotation: ang }, { opacity: 1, scale: 1, rotation: ang, duration: 0.24, ease: "back.out(2.4)" }, t0 + 0.37);
      });
      tl.fromTo("#s5-ciclo-labT", { opacity: 0, y: 12, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, GERADOS - 0.07);
      tl.fromTo("#s5-ciclo-labB", { opacity: 0, y: -12, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, 7.66);

      tl.fromTo(tpunch, { scale: 1 }, { scale: 1.1, duration: 0.12, ease: "power2.out" }, ELA2 - 0.08);
      tl.to(tpunch, { scale: 1, duration: 0.26, ease: "power3.out" }, ELA2 + 0.04);
      tl.fromTo(tpulse, { opacity: 0, scale: 1 }, { opacity: 0.9, scale: 1, duration: 0.01, ease: "none" }, ELA2 - 0.04);
      tl.to(tpulse, { opacity: 0, scale: 1.45, duration: 0.5, ease: "power2.out" }, ELA2 - 0.03);

      /* ---- EXIT (ends 8.38 < 8.433 − 1 frame) ---- */
      OUT(tpos, EXIT);
      OUT(vpos, EXIT + 0.02, { d: 0.24 });
      tl.to("#s5-ciclo-arcs", { opacity: 0, duration: 0.22, ease: "power2.in" }, EXIT);   // opacity only: its drop-shadow filter stays put
      tl.to([headT, headB], { opacity: 0, duration: 0.2, ease: "power2.in" }, EXIT);
      OUT(["#s5-ciclo-glT", "#s5-ciclo-glB"], EXIT, { s: 1.04 });
      OUT(pay, EXIT, { d: 0.24 });

      window.__timelines["s5-ciclo"] = tl;
    })();
