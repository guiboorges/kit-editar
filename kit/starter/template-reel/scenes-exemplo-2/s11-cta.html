  <script>
    (function () {
      const R = document.getElementById("s11-cta-root");
      const q = (s) => R.querySelector(s), qa = (s) => Array.from(R.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const IN = (el, t, o = {}) => tl.fromTo(el,
        { opacity: 0, y: o.y ?? 70, x: o.x ?? 0, scale: o.s ?? 0.94, filter: `blur(${o.b ?? 16}px)` },
        { opacity: 1, y: 0, x: 0, scale: 1, filter: "blur(0px)", duration: o.d ?? 0.5, ease: o.e ?? "power3.out" }, t);
      const POP = (el, t, o = {}) => tl.fromTo(el, { opacity: 0, scale: o.from ?? 0.6 },
        { opacity: 1, scale: 1, duration: o.d ?? 0.4, ease: o.e ?? "back.out(2)", immediateRender: false }, t);

      /* ---------------- cue grid (scene-local word starts) ---------------- */
      const COMENTA = 0.45, CLONE = 0.87, AQUI = 1.17, ENVIAR = 1.91, PASSO1 = 2.59, PASSO2 = 2.89, PRA = 3.17;
      const CRIAR = 3.57, GANHAR = 4.65, DIN = 4.97, AINDA = 5.47, HOJE = 5.79;
      const LAST = 6.12;          // every tween ends inside the last frame (6.133) — NO EXIT, held to the end
      const ROW_H = 128;

      /* ---- 0.08 sheet blur-rise: still moving while the camera collapses (0.24-0.60) and uncovers the stage ---- */
      IN("#s11-cta-sheetE", 0.08, { y: 160, b: 14, d: 0.72 });
      qa("#s11-cta-emos span").forEach((el, i) => POP(el, 0.30 + i * 0.045, { from: 0.4, d: 0.34, e: "back.out(1.7)" }));

      /* ---- collapsed list until CLONE posts: everything below the new slot is parked one row up ---- */
      gsap.set("#s11-cta-below", { y: -ROW_H });
      gsap.set(["#s11-cta-blk", "#s11-cta-fblk"], { scaleX: 0 });

      /* ---- 0.40 "comenta": the input focuses (lime outline) ---- */
      tl.fromTo("#s11-cta-focus", { opacity: 0, scale: 1.015 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, COMENTA - 0.05);
      tl.fromTo("#s11-cta-ph", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.out" }, COMENTA - 0.05);

      /* ---- typing CLONE: discrete states on the key-press beats (0.06 apart), derived from absolute t ---- */
      const SEQ = [
        { t: 0, text: "" }, { t: 0.80, text: "C" }, { t: 0.86, text: "CL" }, { t: 0.92, text: "CLO" },
        { t: 0.98, text: "CLON" }, { t: 1.04, text: "CLONE" }, { t: 1.16, text: "" },
      ];
      const textAt = (t) => { for (let i = SEQ.length - 1; i >= 0; i--) if (t >= SEQ[i].t) return SEQ[i].text; return ""; };
      const typedEl = q("#s11-cta-typed"), caretEl = q("#s11-cta-caret");
      const drv = { t: 0 }; let lastTxt = null, lastCar = null;
      tl.fromTo(drv, { t: 0 }, { t: 1.6, duration: 1.6, ease: "none", immediateRender: false, onUpdate: () => {
        const t = drv.t, txt = textAt(t);
        if (txt !== lastTxt) { lastTxt = txt; typedEl.textContent = txt; }
        // caret: visible while focused; solid while typing, blinking (0.8s square wave) otherwise
        let c = 0;
        if (t >= 0.44 && t < 1.16) c = (t >= 0.74 && t < 1.10) ? 1 : (Math.sin((t - 0.44) * Math.PI * 2 / 0.8 + Math.PI / 2) > -0.2 ? 1 : 0);
        if (c !== lastCar) { lastCar = c; caretEl.style.opacity = String(c); }
      } }, 0);

      /* ---- 1.12 "aqui": send press-release spring + radial lime burst ---- */
      tl.fromTo("#s11-cta-send", { opacity: 0.4 }, { opacity: 1, duration: 0.08, ease: "power1.out", immediateRender: false }, 1.02);
      tl.fromTo("#s11-cta-send", { scale: 1 }, { scale: 0.85, duration: 0.06, ease: "power1.in", immediateRender: false }, 1.06);
      tl.to("#s11-cta-send", { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.12);
      tl.fromTo("#s11-cta-burst", { opacity: 0, scale: 1 }, { opacity: 0.9, scale: 2.4, duration: 0.22, ease: "power2.out", immediateRender: false }, 1.12);
      tl.to("#s11-cta-burst", { opacity: 0, scale: 3.0, duration: 0.36, ease: "power2.in" }, 1.34);
      // input back to idle once posted
      tl.to("#s11-cta-send", { opacity: 0.4, duration: 0.2, ease: "power1.out" }, 1.58);
      tl.to("#s11-cta-focus", { opacity: 0, duration: 0.22, ease: "power1.out" }, 1.22);
      tl.to("#s11-cta-ph", { opacity: 1, duration: 0.22, ease: "power1.out" }, 1.22);

      /* ---- 1.18 the new comment pushes the list down (one tween drives the seam) ---- */
      tl.fromTo("#s11-cta-below", { y: -ROW_H }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 1.18);
      tl.fromTo("#s11-cta-rowNew .tint", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out", immediateRender: false }, 1.22);
      tl.fromTo(["#s11-cta-rowNew .av", "#s11-cta-rowNew .nm", "#s11-cta-rowNew .rp", "#s11-cta-rowNew .hrt"],
        { opacity: 0, y: 18, filter: "blur(4px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out", stagger: 0.03, immediateRender: false }, 1.20);

      /* ---- 1.16 FLIP: the typed CLONE travels from the input (text left 124, centre y 486 pre-push, 30px)
             into the token slot (text left 122, centre y 166, 36px) and lands as a lime token ---- */
      const SC0 = 30 / 36;
      tl.set("#s11-cta-fly", { opacity: 1 }, 1.16);
      tl.fromTo("#s11-cta-fly", { x: 124 - (108 + 14 * SC0), y: 486 - 166, scale: SC0, fontWeight: 700 },
        { x: 0, y: 0, scale: 1, fontWeight: 800, duration: 0.38, ease: "power3.inOut", immediateRender: false }, 1.16);
      tl.fromTo("#s11-cta-fblk", { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "power2.out", immediateRender: false }, 1.19);
      tl.fromTo("#s11-cta-fsh", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out", immediateRender: false }, 1.21);
      tl.to("#s11-cta-fsh", { opacity: 0, duration: 0.12, ease: "power1.in" }, 1.42);
      // hand-off on the landing frame (identical box/font/block): invisible swap
      tl.set("#s11-cta-blk", { scaleX: 1 }, 1.54);
      tl.set("#s11-cta-rowNew .tok .tt", { opacity: 1 }, 1.54);
      tl.set("#s11-cta-fly", { opacity: 0 }, 1.54);
      tl.fromTo("#s11-cta-tok", { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out", immediateRender: false }, 1.54);
      tl.to("#s11-cta-tok", { scale: 1, duration: 0.36, ease: "back.out(2)" }, 1.65);

      /* ---- 1.79 "enviar": DM banner drops in (geometry on back.out, opacity/blur on power2.out) ---- */
      // starts 0.12 early so the banner is already legible ON "enviar" (opacity ~.7 at 1.91, settled ~2.05)
      tl.fromTo("#s11-cta-dmA", { y: -60, scale: 0.96 }, { y: 0, scale: 1, duration: 0.55, ease: "back.out(1.4)", immediateRender: false }, ENVIAR - 0.12);
      tl.fromTo("#s11-cta-dmB", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "power2.out", immediateRender: false }, ENVIAR - 0.12);

      /* ---- 2.36 "todo o passo a passo": the banner unrolls into the DM card; the sheet recedes to a light ghost ---- */
      const EXP = 2.36;
      tl.fromTo("#s11-cta-dmC", { clipPath: "inset(0px 0px 474px 0px round 34px)" },
        { clipPath: "inset(0px 0px 0px 0px round 34px)", duration: 0.5, ease: "power3.out", immediateRender: false }, EXP);
      tl.set("#s11-cta-dmC", { clipPath: "none" }, EXP + 0.52);   // rings/punches may now breathe past the edge
      tl.fromTo("#s11-cta-hair2", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, EXP + 0.04);
      tl.fromTo("#s11-cta-sheetG", { opacity: 1, scale: 1, filter: "blur(0px) brightness(1)" },
        { opacity: 0.3, scale: 0.97, filter: "blur(6px) brightness(1.25)", duration: 0.45, ease: "power2.out", immediateRender: false }, EXP);
      IN("#s11-cta-lab", EXP + 0.08, { y: 12, b: 8, s: 1, d: 0.3 });

      /* ---- checklist: one row per beat (passo 2.59 · passo 2.89 · pra 3.17) ---- */
      [["#s11-cta-row1", PASSO1 - 0.07], ["#s11-cta-row2", PASSO2 - 0.07], ["#s11-cta-row3", PRA - 0.05]].forEach(([sel, t]) => {
        const row = q(sel), svg = row.querySelector(".chk");
        tl.fromTo(row, { opacity: 0, x: -28, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.38, ease: "power3.out", immediateRender: false }, t);
        // check circle draws (svg hidden until the draw starts: no lone round-cap dot), then the tick
        tl.fromTo(svg, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none", immediateRender: false }, t + 0.10);
        tl.fromTo(row.querySelector(".cc"), { strokeDashoffset: 138.23 }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out", immediateRender: false }, t + 0.10);
        tl.fromTo(row.querySelector(".ck"), { strokeDashoffset: 30 }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, t + 0.30);
        POP(row.querySelector(".ico"), t + 0.12, { from: 0.5, d: 0.4, e: "back.out(2)" });
      });

      /* ---- 3.50 "criar o seu": lime ring hugs row 2 + punch + one echo ---- */
      tl.fromTo("#s11-cta-ring", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(1.8)", immediateRender: false }, CRIAR - 0.09);
      tl.fromTo("#s11-cta-row2P", { scale: 1 }, { scale: 1.03, duration: 0.14, ease: "power2.out", immediateRender: false }, CRIAR - 0.07);
      tl.to("#s11-cta-row2P", { scale: 1.015, duration: 0.4, ease: "back.out(2)" }, CRIAR + 0.08);
      tl.fromTo("#s11-cta-rEcho", { opacity: 0, scale: 1 }, { opacity: 0.9, scale: 1, duration: 0.01, ease: "none", immediateRender: false }, CRIAR + 0.04);
      tl.to("#s11-cta-rEcho", { opacity: 0, scale: 1.06, duration: 0.6, ease: "power2.out" }, CRIAR + 0.05);

      /* ---- 4.58 "ganhar dinheiro": "+ $" pill pops at the card's top-right + coin sparkle; punch on "dinheiro" ---- */
      const PP = GANHAR - 0.07;
      tl.fromTo("#s11-cta-ppop", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", immediateRender: false }, PP);
      tl.fromTo("#s11-cta-ppop", { scale: 0.4 }, { scale: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, PP);
      tl.fromTo("#s11-cta-ppunch", { scale: 1 }, { scale: 1.18, duration: 0.1, ease: "power2.out", immediateRender: false }, DIN - 0.06);
      tl.to("#s11-cta-ppunch", { scale: 1, duration: 0.36, ease: "back.out(2)" }, DIN + 0.05);

      // deterministic coin sparkle (seeded; one proxy tween; opacity 0 at T=0 so backward seeks hide it)
      const prand = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      const P4 = "M12 .5Q13.1 10.9 23.5 12 13.1 13.1 12 23.5 10.9 13.1 .5 12 10.9 10.9 12 .5Z";
      const STAR = '<svg viewBox="0 0 24 24"><path d="' + P4 + '" fill="#D4FF3A"/><path d="' + P4 + '" fill="#FFFFFF" transform="translate(12 12) scale(.42) translate(-12 -12)"/></svg>';
      const field = q("#s11-cta-pburst"), parts = [], N = 7;
      const SIZE = [26, 18, 30, 20, 28, 18, 22], SPEED = [230, 190, 260, 200, 240, 180, 210];
      for (let i = 0; i < N; i++) {
        const el = document.createElement("div");
        el.className = "pt"; const s = SIZE[i];
        el.style.width = s + "px"; el.style.height = s + "px"; el.style.marginLeft = (-s / 2) + "px"; el.style.marginTop = (-s / 2) + "px";
        el.innerHTML = STAR; field.appendChild(el);
        // fan -175..-5 deg (up and sideways), never down into the card text
        const a = (-175 + (170 * i) / (N - 1) + (prand(i * 5 + 9) - 0.5) * 8) * Math.PI / 180;
        parts.push({ el, vx: Math.cos(a) * SPEED[i], vy: Math.sin(a) * SPEED[i], spin: (prand(i * 11 + 4) * 2 - 1) * 150 });
      }
      const FL = 0.6, bd = { T: 0 }; let lastK = -1;
      tl.fromTo(bd, { T: 0 }, { T: 1, duration: FL, ease: "none", immediateRender: false, onUpdate: () => {
        const k = Math.round(bd.T * 1000); if (k === lastK) return; lastK = k;
        const t = bd.T * FL, drag = 1 - 0.45 * bd.T;
        const fade = bd.T < 0.45 ? 1 : Math.max(0, (1 - bd.T) / 0.55);
        const sc = bd.T < 0.18 ? 0.3 + 0.7 * (bd.T / 0.18) : 1 - 0.5 * (bd.T - 0.18);
        parts.forEach((p) => {
          const x = p.vx * t * drag, y = p.vy * t * drag + 0.5 * 90 * t * t;
          p.el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${(p.spin * t).toFixed(1)}deg) scale(${sc.toFixed(3)})`;
          p.el.style.opacity = String(bd.T === 0 || bd.T === 1 ? 0 : fade);
        });
      } }, PP + 0.06);

      /* ---- 5.40 "ainda hoje": stamp slam (expo.out: no overshoot, blur may ride it) + echo + card impact ---- */
      const SL = AINDA - 0.07;
      tl.fromTo("#s11-cta-stamp", { opacity: 0, scale: 1.7, rotation: -4, filter: "blur(8px)" },
        { opacity: 1, scale: 1, rotation: -4, filter: "blur(0px)", duration: 0.22, ease: "expo.out", immediateRender: false }, SL);
      tl.fromTo("#s11-cta-stamp", { scale: 1 }, { scale: 1.03, duration: LAST - (SL + 0.22), ease: "none", immediateRender: false }, SL + 0.22);
      tl.fromTo("#s11-cta-sEcho", { opacity: 0, scale: 1 }, { opacity: 0.95, scale: 1, duration: 0.01, ease: "none", immediateRender: false }, SL + 0.11);
      tl.to("#s11-cta-sEcho", { opacity: 0, scale: 1.32, duration: 0.42, ease: "power2.out" }, SL + 0.12);
      tl.fromTo("#s11-cta-dmP", { scale: 1 }, { scale: 1.012, duration: 0.07, ease: "power2.out", immediateRender: false }, SL + 0.04);
      tl.to("#s11-cta-dmP", { scale: 1, duration: 0.32, ease: "power3.out" }, SL + 0.11);
      // a late micro-beat: the creator hearts the checklist; then a soft second echo on "hoje" (ends 6.11)
      tl.fromTo("#s11-cta-heart", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.38, ease: "back.out(2.4)", immediateRender: false }, 5.72);
      tl.fromTo("#s11-cta-sEcho2", { opacity: 0, scale: 1 }, { opacity: 0.7, scale: 1, duration: 0.01, ease: "none", immediateRender: false }, HOJE);
