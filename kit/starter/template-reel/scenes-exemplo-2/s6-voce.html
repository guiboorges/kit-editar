  <script>
    (function () {
      const R = document.getElementById("s6-voce-root");
      const q = (s) => R.querySelector(s), qa = (s) => Array.from(R.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const IN = (el, t, o = {}) => tl.fromTo(el,
        { opacity: 0, y: o.y ?? 70, x: o.x ?? 0, scale: o.s ?? 0.94, filter: `blur(${o.b ?? 16}px)` },
        { opacity: 1, y: 0, x: 0, scale: 1, filter: "blur(0px)", duration: o.d ?? 0.5, ease: o.e ?? "power3.out" }, t);
      const OUT = (el, t, o = {}) => tl.to(el,
        { opacity: 0, scale: o.s ?? 1.04, y: o.y ?? 0, filter: `blur(${o.b ?? 14}px)`, duration: o.d ?? 0.26, ease: "power2.in" }, t);
      // two-channel pop: opacity+blur on power2.out, scale on back.out (blur never overshoots)
      const POP2 = (el, t, o = {}) => {
        tl.fromTo(el, { opacity: 0, filter: `blur(${o.b ?? 8}px)` }, { opacity: 1, filter: "blur(0px)", duration: o.fd ?? 0.16, ease: "power2.out" }, t);
        tl.fromTo(el, { scale: o.from ?? 0.5, y: o.y ?? 0 }, { scale: 1, y: 0, duration: o.d ?? 0.4, ease: o.e ?? "back.out(2.5)", immediateRender: false }, t);
      };

      /* ---------------- cue grid (scene-local word starts) ---------------- */
      const TA1 = 0.07, TA2 = 0.27, TA3 = 0.43, MAS = 0.65;
      const AI = 1.05, SAO = 1.57, GANH = 2.53, DIN = 2.85;
      const E = 3.35, VOCE = 3.75, TAMB = 4.07, PODE = 4.29;
      const EXIT = 4.50;   // exits end 4.76 < 4.80 - 1 frame

      /* ---------------- 1. "tá, tá, tá" — one bubble per word, then flicked away on "mas" ---------------- */
      const bx = ["#s6-voce-b1x", "#s6-voce-b2x", "#s6-voce-b3x"].map(q);
      const bp = ["#s6-voce-b1p", "#s6-voce-b2p", "#s6-voce-b3p"].map(q);
      [TA1 - 0.05, TA2 - 0.05, TA3 - 0.05].forEach((t, i) => {
        tl.fromTo(bp[i], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, t);
        tl.fromTo(bp[i], { scale: 0.45, y: 24 }, { scale: 1, y: 0, duration: 0.42, ease: "back.out(2.5)" }, t);
        // tiny lift while waiting for the flick (alive)
        tl.fromTo(bx[i], { y: 0 }, { y: -8, duration: MAS - 0.03 - t, ease: "none", immediateRender: false }, t);
      });
      // "mas": flicked off to the right (stagger 0.04)
      bx.forEach((el, i) => tl.to(el, { x: 260, rotation: 20, opacity: 0, filter: "blur(14px)", duration: 0.24, ease: "power2.in" }, MAS - 0.03 + i * 0.04));

      /* ---------------- 2. "são pessoas fazendo" — two creator video cards rise into a row ---------------- */
      const Lpos = q("#s6-voce-Lpos"), Rpos = q("#s6-voce-Rpos"), Lin = q("#s6-voce-Lin"), Rin = q("#s6-voce-Rin");
      // they start rising out of a deep blur during "até aí" (no empty stage after the flick) and are sharp on "são pessoas"
      const LIN = AI + 0.07, RIN = AI + 0.17;   // ~95% landed by SAO
      IN(Lin, LIN, { y: 110, s: 0.92, b: 20, d: 0.6 });
      IN(Rin, RIN, { y: 110, s: 0.92, b: 20, d: 0.6 });
      // slow push on the footage (wrapper only; the <video> box never animates)
      tl.fromTo("#s6-voce-Lkb", { scale: 1.08 }, { scale: 1.15, duration: 4.78 - LIN, ease: "none" }, LIN);
      tl.fromTo("#s6-voce-Rkb", { scale: 1.14 }, { scale: 1.21, duration: 4.78 - RIN, ease: "none" }, RIN);

      /* ---------------- 3. "ganhando dinheiro" — "+ $" pills pop on each card + coin sparkle; punch on "dinheiro" ---------------- */
      const PL = GANH - 0.08, PR = GANH + 0.04;   // stagger 0.12
      POP2("#s6-voce-Lpill", PL, { from: 0.4, d: 0.42, e: "back.out(2.4)" });
      POP2("#s6-voce-Rpill", PR, { from: 0.4, d: 0.42, e: "back.out(2.4)" });
      [["#s6-voce-Lpunch", 0], ["#s6-voce-Rpunch", 0.05]].forEach(([el, d]) => {
        tl.fromTo(el, { scale: 1 }, { scale: 1.2, duration: 0.1, ease: "power2.out", immediateRender: false }, DIN - 0.06 + d);
        tl.to(el, { scale: 1, duration: 0.36, ease: "back.out(2)" }, DIN + 0.04 + d);
      });

      // deterministic coin sparkle (seeded, one proxy per pill, writes transforms in onUpdate)
      const prand = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      const P4 = "M12 .5Q13.1 10.9 23.5 12 13.1 13.1 12 23.5 10.9 13.1 .5 12 10.9 10.9 12 .5Z";
      const STAR = '<svg viewBox="0 0 24 24"><path d="' + P4 + '" fill="#D4FF3A"/><path d="' + P4 + '" fill="#FFFFFF" transform="translate(12 12) scale(.42) translate(-12 -12)"/></svg>';
      const burst = (sel, seed, t0) => {
        const field = q(sel), parts = [], N = 6;
        const SIZE = [24, 18, 28, 20, 26, 18], SPEED = [210, 180, 240, 190, 230, 170];
        for (let i = 0; i < N; i++) {
          const el = document.createElement("div");
          el.className = "pt"; const s = SIZE[i];
          el.style.width = s + "px"; el.style.height = s + "px"; el.style.marginLeft = (-s / 2) + "px"; el.style.marginTop = (-s / 2) + "px";
          el.innerHTML = STAR; field.appendChild(el);
          const a = (-160 + (140 * i) / (N - 1) + (prand(seed + i * 7) - 0.5) * 10) * Math.PI / 180;
          parts.push({ el, vx: Math.cos(a) * SPEED[i], vy: Math.sin(a) * SPEED[i], spin: (prand(seed + i * 13) * 2 - 1) * 140 });
        }
        const FL = 0.55, d = { T: 0 }; let lastK = -1;
        tl.fromTo(d, { T: 0 }, { T: 1, duration: FL, ease: "none", immediateRender: false, onUpdate: () => {
          const k = Math.round(d.T * 1000); if (k === lastK) return; lastK = k;
          const t = d.T * FL, drag = 1 - 0.45 * d.T;
          const fade = d.T < 0.45 ? 1 : Math.max(0, (1 - d.T) / 0.55);
          const sc = d.T < 0.18 ? 0.3 + 0.7 * (d.T / 0.18) : 1 - 0.5 * (d.T - 0.18);
          parts.forEach((p) => {
            const x = p.vx * t * drag, y = p.vy * t * drag + 0.5 * 90 * t * t;
            p.el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${(p.spin * t).toFixed(1)}deg) scale(${sc.toFixed(3)})`;
            p.el.style.opacity = String(d.T === 0 || d.T === 1 ? 0 : fade);
          });
        } }, t0);
      };
      burst("#s6-voce-Lburst", 3, PL + 0.08);
      burst("#s6-voce-Rburst", 41, PR + 0.08);

      /* ---------------- holding: phase-opposed float on the two creator cards ---------------- */
      const Lf = q("#s6-voce-Lflt"), Rf = q("#s6-voce-Rflt");
      const F0 = RIN + 0.55, F1 = 4.78, PER = 2.4, AMP = 6;
      const ph = { p: 0 }; let lastY = null;
      tl.fromTo(ph, { p: 0 }, { p: (F1 - F0) / PER * Math.PI * 2, duration: F1 - F0, ease: "none", immediateRender: false, onUpdate: () => {
        const env = Math.min(1, ph.p / 1.2);
        const s = (Math.sin(ph.p) * AMP * env).toFixed(2);
